<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Iniciativas · Pipeline Chile</title>
<link rel="stylesheet" href="/styles.css">
<style>
  header {
    position: sticky; top: 0; z-index: 5; background: var(--plano); border-bottom: 1px solid var(--borde);
    padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
  }
  main { padding: 24px; max-width: 1400px; margin: 0 auto; display: grid; gap: 24px; }
  .panel { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 20px; }
  
  .okr-card {
    background: linear-gradient(135deg, rgba(79, 70, 229, 0.12), rgba(16, 185, 129, 0.08));
    border: 1px solid var(--azul); padding: 24px; border-radius: var(--radio); display: grid; gap: 16px;
  }
  .okr-header h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--azul); }
  .okr-header h3 { font-size: 20px; margin: 4px 0 0; }
  .okr-metricas { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-top: 8px; }
  .okr-box { background: var(--superficie); padding: 14px 16px; border-radius: 8px; border: 1px solid var(--borde); }
  .okr-box .etq { font-size: 11px; text-transform: uppercase; color: var(--tinta-3); }
  .okr-box .num { font-size: 24px; font-weight: 700; color: var(--tinta); margin: 4px 0; }
  .okr-box .sub { font-size: 12px; color: var(--tinta-2); }

  .etapas-bars { display: grid; gap: 8px; margin-top: 12px; }
  .etapa-row { display: grid; grid-template-columns: 140px 1fr 90px; gap: 12px; align-items: center; font-size: 13px; }
  .etapa-fill { height: 12px; border-radius: 6px; background: var(--azul); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Mis Iniciativas · OKR Beto</h1>
    <span class="muted" style="font-size:12px;">Revisión semanal 1:1 con Tomi</span>
  </div>
  <div>
    <a class="boton" href="/">← Torre de control</a>
  </div>
</header>
<main id="app">
  <div style="padding: 40px; text-align: center; color: var(--tinta-3);">Cargando iniciativas...</div>
</main>

<script type="module">
import { cargarDatos, usd, esc, etapaCorta } from '/common.js';

const $ = (s) => document.querySelector(s);

async function cargar() {
  try {
    const d = await cargarDatos();
    const ini = d.iniciativas;
    if (!ini) throw new Error("Falta la data de iniciativas");

    const okr = ini.okr;
    const tgp = ini.iniciativa1_tgp;
    const beto = ini.iniciativa4_beto;

    const maxDias = Math.max(...okr.diasPorEtapa.map(x => x.p75), 1);

    $('#app').innerHTML = `
      <!-- BLOQUE OKR & KEY RESULT -->
      <section class="okr-card">
        <div class="okr-header">
          <h2>Objetivo Trimestral</h2>
          <h3>${esc(okr.objetivo)}</h3>
          <p class="muted" style="font-size:13px; margin:4px 0 0;"><strong>Key Result:</strong> ${esc(okr.keyResult)}</p>
        </div>
        <div class="okr-metricas">
          <div class="okr-box">
            <span class="etq">Mediana Actual</span>
            <div class="num" style="color:var(--azul);">${okr.medianaActual} días</div>
            <span class="sub">Reunión a firma (n = ${okr.n})</span>
          </div>
          <div class="okr-box">
            <span class="etq">Punto de Partida (X)</span>
            <div class="num">${okr.puntoPartidaX} días</div>
            <span class="sub">Congelado al 19-oct</span>
          </div>
          <div class="okr-box">
            <span class="etq">Meta (Y)</span>
            <div class="num" style="color:var(--tinta-3);">${okr.metaY ? okr.metaY + ' días' : 'Por definir'}</div>
            <span class="sub">A fijar con Tomi</span>
          </div>
        </div>
      </section>

      <!-- TIEMPOS POR ETAPA (2.1) -->
      <section class="panel">
        <h2>Días de Permanencia por Etapa (Mediana y p75)</h2>
        <p class="muted" style="font-size:12px; margin-bottom:16px;">Mide dónde se ralentiza el flujo para atacar cuellos de botella.</p>
        <div class="etapas-bars">
          ${okr.diasPorEtapa.map(e => `
            <div class="etapa-row">
              <span>${esc(etapaCorta(e.etapa))}</span>
              <div style="background:var(--superficie-2); height:12px; border-radius:6px; overflow:hidden;">
                <div class="etapa-fill" style="width:${Math.min(100, (e.p75 / maxDias) * 100)}%;"></div>
              </div>
              <span class="muted" style="text-align:right;"><strong>${e.mediana}d</strong> (p75: ${e.p75}d)</span>
            </div>
          `).join('')}
        </div>
      </section>

      <!-- INICIATIVA 1 & INICIATIVA 4 -->
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap:24px;">
        <section class="panel">
          <h2>Iniciativa 1 · Calidad TGP vs. Prospección Seba</h2>
          <p class="muted" style="font-size:12px; margin-bottom:16px;">Métrica 1.4: % de deals que alcanzaron Build consensus en 45 días.</p>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; text-align:center;">
            <div class="okr-box">
              <span class="etq">TGP</span>
              <div class="num" style="color:var(--azul);">${tgp.conversion45d.tasa}%</div>
              <span class="sub">${tgp.conversion45d.convertidos} de ${tgp.conversion45d.total} deals (&ge;45d)</span>
            </div>
            <div class="okr-box">
              <span class="etq">SDR Interno (Seba)</span>
              <div class="num" style="color:var(--bien);">${tgp.conversionSebaComparativa.tasa}%</div>
              <span class="sub">${tgp.conversionSebaComparativa.convertidos} de ${tgp.conversionSebaComparativa.total} deals</span>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>Iniciativa 4 · Deals que lidera Beto</h2>
          <p class="muted" style="font-size:12px; margin-bottom:16px;">Métrica 4.1: ARR gestionado personalmente y avance semanal.</p>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:16px; text-align:center;">
            <div class="okr-box">
              <span class="etq">ARR Total en Juego</span>
              <div class="num">${usd(beto.totalArrUsd)}</div>
              <span class="sub">${beto.deals.length} deals abiertos</span>
            </div>
            <div class="okr-box">
              <span class="etq">Avanzado esta Semana</span>
              <div class="num" style="color:var(--bien);">${usd(beto.arrAvanzadoSemana)}</div>
              <span class="sub">Deals con cambio de etapa</span>
            </div>
          </div>
          <table class="tabla">
            <thead><tr><th>Deal</th><th>Etapa</th><th>ARR</th></tr></thead>
            <tbody>
              ${beto.deals.map(d => `
                <tr>
                  <td><a href="${d.url}" target="_blank"><strong>${esc(d.cuenta)}</strong></a></td>
                  <td>${esc(etapaCorta(d.etapa))}</td>
                  <td>${usd(d.arrUsd)}</td>
                </tr>
              `).join('') || '<tr><td colspan="3" class="muted">Sin deals asignados.</td></tr>'}
            </tbody>
          </table>
        </section>
      </div>
    `;
  } catch (e) {
    $('#app').innerHTML = `<div style="padding:40px; color:var(--critico); text-align:center;">Error: ${e.message}</div>`;
  }
}

cargar();
</script>
</body>
</html>
