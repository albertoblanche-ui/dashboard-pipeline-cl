<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Negocios en Chile · Telepatía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Vista de Jaime: solo verde, rojo y blanco sobre el fondo crema de Telepatía. */
  :root {
    --carbon: #1C211C;
    --calcio: #F6F5EB;
    --blanco: #FCFCFC;
    --borde: #D5E0D2;
    --texto-2: #576A55;
    --verde: #055A35;
    --verde-fondo: #E3EFE6;
    --rojo: #B42318;
    --rojo-fondo: #FBE9E7;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--calcio); color: var(--carbon); font: 22px/1.45 'IBM Plex Sans', system-ui, sans-serif; }
  .contenedor { max-width: 820px; margin: 0 auto; padding: 32px 20px 72px; }
  h1, h2 { font-family: 'IBM Plex Serif', Georgia, serif; font-weight: 400; margin: 0; }
  h1 { font-size: 38px; line-height: 1.2; }
  h2 { font-size: 26px; margin: 44px 0 12px; color: var(--texto-2); }
  .logo { height: 28px; display: block; margin-bottom: 24px; }
  .bajada { color: var(--texto-2); margin: 6px 0 0; font-size: 19px; }
  .oculto { display: none !important; }

  /* Resumen: tres números */
  .resumen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 28px; }
  .cifra { background: var(--blanco); border: 2px solid var(--borde); border-radius: 16px; padding: 18px 20px; }
  .cifra b { display: block; font-family: 'IBM Plex Serif', Georgia, serif; font-weight: 400; font-size: 52px; line-height: 1; }
  .cifra span { font-size: 20px; font-weight: 600; }
  .cifra.verde { border-color: var(--verde); background: var(--verde-fondo); color: var(--verde); }
  .cifra.rojo { border-color: var(--rojo); background: var(--rojo-fondo); color: var(--rojo); }

  /* Filas */
  .fila { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--blanco); border: 2px solid var(--borde); border-left-width: 12px; border-radius: 14px;
    padding: 18px 20px; margin-top: 10px; }
  .fila.verde { border-left-color: var(--verde); }
  .fila.rojo { border-left-color: var(--rojo); }
  .fila .linea { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .fila .nombre { font-weight: 600; font-size: 24px; }
  .fila .arr { white-space: nowrap; font-size: 22px; }
  .etiqueta { display: inline-block; font-size: 16px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    border-radius: 999px; padding: 1px 10px; margin-left: 10px; vertical-align: 3px; }
  .verde .etiqueta { background: var(--verde); color: var(--blanco); }
  .rojo .etiqueta { background: var(--rojo); color: var(--blanco); }
  .fila .detalle { display: block; margin-top: 8px; color: var(--texto-2); font-size: 20px; }
  .fila .detalle.oculto { display: none; }
  .contactos { display: block; margin-top: 6px; }
  .persona { display: block; font-size: 20px; color: var(--carbon); }
  .persona b { font-weight: 500; }
  .mas { display: block; font-size: 18px; color: var(--texto-2); }
  .fila[aria-expanded="true"] .resumen-mas { display: none; }
  .fila:focus-visible { outline: 3px solid var(--carbon); outline-offset: 2px; }

  .reglas { margin-top: 48px; color: var(--texto-2); font-size: 18px; border-top: 1px solid var(--borde); padding-top: 16px; }
  .reglas p { margin: 4px 0; }

  /* Ingreso */
  #ingreso { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  #ingreso form { background: var(--blanco); border: 2px solid var(--borde); border-radius: 16px; padding: 40px; width: 100%; max-width: 440px; }
  #ingreso label { display: block; font-weight: 600; margin: 28px 0 8px; }
  #ingreso input { width: 100%; font: inherit; font-size: 26px; padding: 14px 16px; border: 2px solid var(--borde); border-radius: 10px; background: #fff; }
  #ingreso input:focus { outline: none; border-color: var(--verde); }
  #ingreso button { margin-top: 20px; width: 100%; font: inherit; font-size: 24px; font-weight: 600; padding: 16px; border: 0; border-radius: 10px; background: var(--verde); color: var(--blanco); cursor: pointer; }
  #error-clave { color: var(--rojo); margin: 12px 0 0; min-height: 1.5em; }
  #mensaje { text-align: center; color: var(--texto-2); margin-top: 80px; }

  @media (max-width: 600px) {
    body { font-size: 20px; }
    h1 { font-size: 30px; }
    .resumen { gap: 8px; }
    .cifra { padding: 14px 12px; }
    .cifra b { font-size: 40px; }
    .cifra span { font-size: 17px; }
    .fila { padding: 16px; }
    .fila .linea { flex-direction: column; gap: 2px; }
    .fila .nombre { font-size: 22px; }
  }
</style>
</head>
<body>

<section id="ingreso" class="oculto">
  <form>
    <img class="logo" src="/logo-dark.svg" alt="Telepatía">
    <h1>Negocios en Chile</h1>
    <label for="clave">Clave</label>
    <input id="clave" type="password" autocomplete="current-password">
    <button type="submit">Entrar</button>
    <p id="error-clave" role="alert"></p>
  </form>
</section>

<main id="panel" class="contenedor oculto">
  <img class="logo" src="/logo-dark.svg" alt="Telepatía">
  <h1>Negocios de Telepatía en Chile</h1>
  <p class="bajada" id="actualizado"></p>
  <p id="mensaje">Cargando…</p>
  <div id="contenido"></div>
</main>

<script type="module">
  import { usd, esc } from '/common.js';
  const LS = 'jaime-clave';
  const $ = (id) => document.getElementById(id);
  const ETIQUETA = { verde: () => 'Avanza', rojo: (d) => `Estancado hace ${d.diasEtapa} días` };

  const leer = () => { try { return localStorage.getItem(LS) ?? ''; } catch { return ''; } };
  const guardar = (v) => { try { v ? localStorage.setItem(LS, v) : localStorage.removeItem(LS); } catch {} };

  function cuando(iso) {
    const d = new Date(iso);
    const hora = d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hour12: false });
    if (d.toDateString() === new Date().toDateString()) return `hoy a las ${hora}`;
    return d.toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' }) + ` a las ${hora}`;
  }

  function fila(d) {
    const texto = d.firmado ? 'Firmado' : ETIQUETA[d.color]?.(d);
    const etiqueta = texto ? `<span class="etiqueta">${texto}</span>` : '';
    const detalle = [d.razon, d.owner ? `Lo lleva ${d.owner}` : ''].filter(Boolean).join(' · ');
    const persona = (c) => `<span class="persona"><b>${esc(c.nombre)}</b>${c.cargo ? `, ${esc(c.cargo)}` : ''}</span>`;
    const cs = d.contactos ?? [];
    const contactos = cs.length ? `<span class="contactos">${cs.slice(0, 2).map(persona).join('')}</span>` : '';
    const resto = cs.length > 2 ? `<span class="contactos">${cs.slice(2).map(persona).join('')}</span>` : '';
    const mas = cs.length > 2 ? `<span class="mas">y ${cs.length - 2} más</span>` : '';
    return `<button class="fila ${d.color}" aria-expanded="false">
      <span class="linea"><span class="nombre">${esc(d.cuenta)}${etiqueta}</span><span class="arr">${d.arrEstimado ? '≈ ' : ''}${usd(d.arrUsd)}</span></span>
      ${contactos}${mas ? `<span class="resumen-mas">${mas}</span>` : ''}
      <span class="detalle oculto">${resto}<span>${esc(detalle)}</span></span>
    </button>`;
  }

  function pintar(p) {
    $('actualizado').textContent = `Actualizado ${cuando(p.actualizado)}`;
    const todos = p.secciones.flatMap((s) => s.deals);
    const n = (f) => todos.filter(f).length;
    const firmados = p.secciones[0].deals.length;
    $('contenido').innerHTML = `
      <div class="resumen">
        <div class="cifra verde"><b>${firmados}</b><span>${firmados === 1 ? 'firmado' : 'firmados'}</span></div>
        <div class="cifra verde"><b>${n((d) => d.color === 'verde') - firmados}</b><span>avanzando</span></div>
        <div class="cifra rojo"><b>${n((d) => d.color === 'rojo')}</b><span>${n((d) => d.color === 'rojo') === 1 ? 'estancado' : 'estancados'}</span></div>
      </div>
      ${p.secciones.filter((s) => s.deals.length).map((s) => `<h2>${esc(s.nombre)}</h2>${s.deals.map(fila).join('')}`).join('')}
      <div class="reglas">
        <p><b>Avanza:</b> firmado o subió de etapa en los últimos ${p.reglas.diasVerde} días.</p>
        <p><b>Estancado:</b> más de ${p.reglas.diasRojo} días sin pasar de etapa. Los días cuentan desde que entró a la etapa.</p>
        <p>Toque un negocio para ver quién lo lleva y el resto de los contactos.</p>
      </div>`;
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('.fila');
    if (!b) return;
    const abierto = b.getAttribute('aria-expanded') === 'true';
    b.setAttribute('aria-expanded', String(!abierto));
    b.querySelector('.detalle').classList.toggle('oculto', abierto);
  });

  function mostrarIngreso(error = '') {
    $('panel').classList.add('oculto');
    $('ingreso').classList.remove('oculto');
    $('error-clave').textContent = error;
    $('clave').value = '';
    $('clave').focus();
  }

  async function cargar() {
    const clave = leer();
    if (!clave) return mostrarIngreso();
    $('ingreso').classList.add('oculto');
    $('panel').classList.remove('oculto');
    try {
      const r = await fetch('/api/jaime', { headers: { 'x-dashboard-clave': clave } });
      if (r.status === 401) { guardar(''); return mostrarIngreso('Clave incorrecta.'); }
      if (!r.ok) throw new Error();
      const p = await r.json();
      $('mensaje').classList.add('oculto');
      pintar(p);
    } catch {
      $('mensaje').classList.remove('oculto');
      $('mensaje').textContent = 'No se pudieron leer los datos. Intente de nuevo en unos minutos.';
    }
  }

  $('ingreso').querySelector('form').addEventListener('submit', (e) => {
    e.preventDefault();
    guardar($('clave').value);
    cargar();
  });

  cargar();
  setInterval(cargar, 3600000); // con la página abierta, se actualiza sola cada hora
</script>
</body>
</html>
