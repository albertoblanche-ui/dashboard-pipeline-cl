<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pipeline Chile</title>
<!-- Desde el 20-nov-2026 el dashboard es una sola vista en /. El Panel viejo redirige ahí (y /panel?jaime=1 a /jaime). -->
<script>
  const p = new URLSearchParams(location.search);
  if (p.has('jaime')) location.replace('/jaime');
  else location.replace('/' + (p.has('tv') ? '?auto=1' : '') + (p.has('celebrar') ? (p.has('tv') ? '&' : '?') + 'celebrar=1' : ''));
</script>
</head>
<body style="background:#F6F5EB"></body>
</html>
