<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Chile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Vista única (rediseño 20-nov-2026): reemplaza Panel, Torre de control, modo TV e Iniciativas.
     Marca Telepatía: Carbon Black, Living Green, Mineral Green, Calcium White y escala oliva. */
  :root {
    /* La paleta vigente es Bosque (más abajo); estos son los colores base de la marca */
    --carbon: #1C211C; --verde: #055A35; --mineral: #9FA782; --calcio: #F6F5EB;
    --olivo-100: #ECF1E9; --olivo-200: #D5E0D2; --olivo-300: #BCCCB7; --olivo-500: #8AA285; --olivo-700: #576A55;
    /* Un solo modo (21-nov): intermedio entre claro y oscuro, fondo gris oliva suave y tarjetas que no encandilan */
    --fondo: #D8DDD0; --tarjeta: #ECEFE7; --tarjeta-2: #DFE4D8; --borde: #C2C9B8;
    --tinta: var(--carbon); --tinta-2: #4C5D4A; --tinta-3: #6A7B66;
    --acento: var(--verde); --acento-suave: #CEEADC;
    --equipo: var(--verde); --tgp: var(--mineral);
    --sube: #1E7A4C; --sube-fondo: #DDF1E5; --estancado: #C6403A; --estancado-fondo: #F8E1DF; --espera: #D99A12; --espera-fondo: #FBF0D5;
    --normal-borde: var(--olivo-300);
    --serif: 'IBM Plex Serif', Georgia, serif; --sans: 'IBM Plex Sans', system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--fondo); color: var(--tinta); font: 14px/1.45 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  h1, h2, h3 { margin: 0; font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em; }
  button { font: inherit; cursor: pointer; color: inherit; }

  /* Barra fija arriba: logo, filtros que valen para todo, controles */
  .top { display: flex; align-items: center; gap: 10px 22px; padding: 10px 24px; border-bottom: 1px solid var(--borde); flex-wrap: wrap; background: var(--fondo); }
  .top .logo { height: 22px; display: block; }
  .filtros { display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; }
  .grupo { display: flex; align-items: center; gap: 6px; }
  .grupo > span { font-size: 12px; color: var(--tinta-3); text-transform: uppercase; letter-spacing: .05em; }
  .seg { display: inline-flex; background: var(--tarjeta-2); border-radius: 9px; padding: 2px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 4px 11px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--tinta-2); white-space: nowrap; }
  .seg button[aria-pressed='true'] { background: var(--tarjeta); color: var(--tinta); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .1); }
  /* Filtro u opción que no está en "todo": ámbar, para que se note */
  .seg.cambiado { background: #F3DFA8; box-shadow: inset 0 0 0 1.5px #D99A12; }
  .seg.cambiado button[aria-pressed='true'] { background: #D99A12; color: var(--carbon); font-weight: 700; }
  .btn.reset { background: #FBEFD0; border-color: #D99A12; color: #7A4E00; }
  .btn.reset:hover { background: #F3DFA8; }
  .top .der { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--tinta-3); font-size: 12.5px; }
  .btn { border: 1px solid var(--borde); background: var(--tarjeta); border-radius: 9px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .btn:hover { border-color: var(--olivo-500); }
  .btn[aria-pressed='true'] { background: var(--verde); border-color: var(--verde); color: #FCFCFC; }
  .btn.ic { padding: 6px 9px; }

  /* Diapositivas: una a la vez, cada una cabe en la pantalla */
  main { position: relative; min-height: 0; padding: 14px 24px 6px; }
  .diapo { display: none; height: 100%; gap: 16px; min-height: 0; }
  .diapo.activa { display: grid; animation: aparece .45s ease both; }
  .diapo.una { grid-template-rows: minmax(0, 1fr); }
  .diapo.dos { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); }
  @keyframes aparece { from { opacity: 0; transform: translateY(8px); } }
  .card { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 16px; padding: 16px 20px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .card > header { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .card > header h2 { font-size: 21px; }
  .card > header .sub { color: var(--tinta-3); font-size: 13px; }
  .card > header .ops { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .cuerpo { flex: 1; min-height: 0; position: relative; }
  .grafico { width: 100%; height: 100%; }
  .grafico svg { display: block; width: 100%; height: 100%; overflow: visible; }
  svg text { font-family: var(--sans); fill: var(--tinta-2); font-size: 12px; }
  svg .eje { stroke: var(--borde); }
  svg [data-lista] { cursor: zoom-in; }
  svg [data-tip]:hover { opacity: .82; }
  .resumen { margin: 10px 0 0; font-size: 13.5px; color: var(--tinta-2); }
  .resumen b { color: var(--tinta); }
  .nota { font-size: 12px; color: var(--tinta-3); margin: 8px 0 0; }
  /* Cohortes (26-nov noche): análisis que se recorre con scroll, una pantalla por gráfico */
  .coh-v { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; }
  .coh-filtros { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
  .coh-filtros .g { display: flex; align-items: center; gap: 7px; }
  .coh-filtros .g > span { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-3); }
  .coh-tit { margin: 2px 0 0; font-size: 15px; color: var(--tinta-2); }
  .coh-tit b { color: var(--tinta); }
  .coh-g { flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; display: grid; }
  .coh-g .aviso { align-self: center; justify-self: center; color: var(--tinta-3); font-size: 15px; }
  .coh-ley { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--tinta-2); }
  .coh-ley span { display: inline-flex; align-items: center; gap: 6px; }
  .coh-ley i { width: 18px; height: 12px; border-radius: 3px; display: inline-block; }
  .coh-ley .tenue i { border: 1.5px dashed var(--tinta-3); }
  .coh-ley b { font-weight: 600; color: var(--tinta); margin-right: 4px; }
  .leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--tinta-2); }
  .leyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }

  /* Camino al millón */
  .kpis { display: flex; gap: 10px 28px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
  .kpi { display: grid; gap: 0; }
  .kpi small { font-size: 12px; color: var(--tinta-3); text-transform: uppercase; letter-spacing: .05em; }
  .kpi b { font-family: var(--serif); font-size: 30px; line-height: 1.1; font-weight: 600; }
  .kpi span { font-size: 12.5px; color: var(--tinta-2); }
  .kpi.grande b { font-size: 40px; color: var(--acento); }
  .avance { flex: 1; min-width: 220px; display: grid; gap: 6px; padding-bottom: 6px; }
  .avance .riel { height: 14px; background: var(--tarjeta-2); border-radius: 999px; overflow: hidden; }
  .avance .riel i { display: block; height: 100%; background: linear-gradient(90deg, var(--olivo-700), var(--verde)); border-radius: 999px; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .avance .marcas { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--tinta-3); }

  /* Kanban: nombre y ARR siempre visibles; el alto va por tramos de ARR */
  .kanban { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; height: 100%; }
  .col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .col .cab { padding: 0 2px 6px; border-bottom: 3px solid var(--olivo-300); margin-bottom: 6px; }
  .col .cab b { font-size: 14px; display: block; }
  .col .cab small { color: var(--tinta-3); font-size: 12px; }
  .col.meta .cab { border-color: var(--verde); }
  .pila { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
  .deal { flex: none; border: 1px solid var(--borde); border-left: 5px solid var(--normal-borde); border-radius: 7px; background: var(--tarjeta-2);
    padding: 0 8px; display: flex; flex-direction: column; justify-content: center; gap: 1px; overflow: hidden; text-align: left; line-height: 1.2; min-width: 0;
    animation: entra .45s cubic-bezier(.2,.8,.2,1) both; }
  .deal:hover { border-color: var(--olivo-500); }
  .deal .l1 { display: flex; gap: 6px; justify-content: space-between; align-items: baseline; white-space: nowrap; min-width: 0; font-size: 12.5px; }
  .deal .nom { font-weight: 600; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .deal .arr { color: var(--tinta-2); font-size: 12px; flex: none; }
  .deal .l2 { font-size: 11.5px; color: var(--tinta-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deal .own { font-weight: 700; }
  .deal.t3 .nom, .deal.t4 .nom { font-size: 14.5px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .deal.t3 .l1, .deal.t4 .l1 { flex-direction: column; align-items: flex-start; white-space: normal; gap: 2px; }
  .deal.t3 .arr, .deal.t4 .arr { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--tinta); }
  .deal.t4 .arr { font-size: 26px; }
  .deal.est-sube { border-left-color: var(--sube); background: var(--sube-fondo); }
  .deal.est-estancado { border-left-color: var(--estancado); background: var(--estancado-fondo); }
  .deal.est-espera { border-left-color: var(--espera); background: var(--espera-fondo); }
  .deal.firmado { background: var(--verde); border-color: var(--verde); color: #FCFCFC; }
  .deal.firmado .arr, .deal.firmado .l2 { color: rgb(252 252 252 / .85); }
  .deal .tag { font-size: 10px; font-weight: 700; letter-spacing: .03em; }
  .deal .retro { font-size: 10px; font-weight: 700; color: var(--espera); }
  .deal.resto { border-style: dashed; border-left-width: 1px; background: transparent; align-items: center; flex-direction: row; gap: 6px; font-size: 12px; font-weight: 600; color: var(--tinta-2); justify-content: center; }
  .deal.resto small { font-weight: 500; color: var(--tinta-3); }
  .deal.resto:hover { background: var(--tarjeta-2); }
  .chips { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--tinta-2); }
  .chips i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border-left: 4px solid; }
  @keyframes entra { from { opacity: 0; transform: translateX(-10px); } }

  /* Pipeline por etapa */
  .fn { display: grid; grid-template-columns: 120px 1fr 200px; gap: 12px; align-items: center; padding: 6px 4px; font-size: 13.5px; border-radius: 8px; cursor: zoom-in; }
  .fn:hover { background: var(--tarjeta-2); }
  .fn .riel { height: 24px; background: var(--tarjeta-2); border-radius: 6px; overflow: hidden; display: flex; }
  .fn .riel i { display: block; height: 100%; }
  .fn .num { text-align: right; } .fn .num small { color: var(--tinta-3); }
  .fuentes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pill { border: 1px solid var(--borde); background: transparent; color: var(--tinta-2); padding: 3px 11px; border-radius: 999px; font-size: 12.5px; }
  .pill:hover { border-color: var(--olivo-500); } .pill small { opacity: .7; margin-left: 4px; }
  .pill[aria-pressed='true'] { background: var(--verde); border-color: var(--verde); color: #FCFCFC; }

  /* Tablas */
  .tabla-scroll { overflow: auto; max-height: 100%; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  .t th { text-align: left; font-weight: 600; color: var(--tinta-3); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--borde); white-space: nowrap; position: sticky; top: 0; background: var(--tarjeta); }
  .t td { padding: 11px 10px; border-bottom: 1px solid var(--borde); vertical-align: top; }
  .t .num { text-align: right; white-space: nowrap; } .t .mal { color: var(--estancado); font-weight: 600; }
  .t small { color: var(--tinta-3); }
  .t [data-lista] { cursor: zoom-in; } .t tr:hover td { background: var(--tarjeta-2); }
  .t .pct { display: grid; gap: 4px; justify-items: end; }
  .t .pct .barra { width: 90px; height: 6px; border-radius: 3px; background: var(--tarjeta-2); overflow: hidden; }
  .t .pct .barra i { display: block; height: 100%; background: var(--acento); }
  .t tr.tot td { font-weight: 600; background: var(--tarjeta-2); }

  /* Mapa de Chile */
  .mapa2 { display: grid; grid-template-columns: 110px minmax(0, 1fr) minmax(300px, 30%); gap: 16px; height: 100%; min-height: 0; }
  .mapa2 .mini { min-height: 0; background: var(--fondo); border: 1px solid var(--borde); border-radius: 12px; cursor: crosshair; touch-action: none; }
  .mapa2 .principal { position: relative; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .mapa2 .lienzo { flex: 1; min-height: 0; background: var(--fondo); border: 1px solid var(--borde); border-radius: 14px; overflow: hidden; cursor: grab; touch-action: none; }
  .mapa2 .lienzo.arrastrando { cursor: grabbing; }
  .mapa2 .lienzo svg { display: block; }
  .mapa2 .zonas { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .mapa2 .zonas .btn { box-shadow: 0 1px 3px rgb(0 0 0 / .08); }
  .mapa2 .ley-mapa { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
  .grad { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--tinta-2); }
  .grad i { width: 110px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, color-mix(in srgb, var(--acento) 18%, var(--tarjeta-2)), color-mix(in srgb, var(--acento) 58%, var(--tarjeta-2))); }
  .mapa2 .lado { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .mapa2 .lado .tabla-scroll { flex: 1; min-height: 0; }
  .en-pantalla { background: var(--tarjeta-2); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
  .ep-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; } .ep-cab b { font-family: var(--serif); font-size: 17px; } .ep-cab span { font-size: 12.5px; color: var(--tinta-2); }
  .ep-nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .ep-nums div { background: var(--tarjeta); border-radius: 8px; padding: 6px 8px; font-size: 11.5px; color: var(--tinta-2); }
  .ep-nums b { display: block; font-family: var(--serif); font-size: 18px; color: var(--tinta); }
  .ep-top { display: flex; flex-wrap: wrap; gap: 5px; } .ep-top .pill { background: var(--tarjeta); }
  .ops-etq { font-size: 11.5px; color: var(--tinta-3); text-transform: uppercase; letter-spacing: .05em; margin-left: 4px; }
  .barra-r { display: block; height: 8px; border-radius: 4px; background: var(--tarjeta-2); overflow: hidden; } .barra-r i { display: block; height: 100%; background: var(--acento); }
  .mapa-t tr[data-region] { cursor: pointer; } .mapa-t tr.sel td { background: var(--acento-suave); }
  .mapa-t td { padding: 7px 10px; }

  /* Pie: navegación y pendientes */
  .pie { display: flex; align-items: center; gap: 12px; padding: 8px 24px 12px; color: var(--tinta-3); font-size: 12.5px; }
  .nav { display: flex; align-items: center; gap: 6px; }
  #puntos { display: flex; gap: 4px; }
  #puntos { flex-wrap: wrap; }
  #puntos button { border: 1px solid transparent; background: var(--tarjeta-2); height: 28px; border-radius: 8px; padding: 0 10px 0 6px; font-size: 12.5px; font-weight: 500; color: var(--tinta-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  #puntos button .n { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; background: var(--tarjeta); font-size: 11px; font-weight: 700; color: var(--tinta-3); }
  #puntos button:hover { border-color: var(--olivo-500); color: var(--tinta); }
  #puntos button.on { background: var(--verde); color: #FCFCFC; font-weight: 700; }
  #puntos button.on .n { background: rgb(252 252 252 / .2); color: #FCFCFC; }
  /* Según el ancho efectivo (ya escalado), que calcula escalar() */
  body.angosto .pie .ayuda { display: none; } body.angosto #puntos button { padding: 0 8px 0 5px; font-size: 12px; }
  #nombre { font-weight: 600; color: var(--tinta-2); }
  .pie .ayuda { margin-left: auto; }
  #progreso { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--acento); width: 0; z-index: 5; }

  /* Desplegable de pendientes */
  .cajon { position: fixed; left: 0; right: 0; bottom: 0; height: min(86vh, 900px); z-index: 20; background: var(--fondo); border-top: 1px solid var(--borde);
    border-radius: 20px 20px 0 0; box-shadow: 0 -20px 60px rgb(0 0 0 / .25); transform: translateY(102%); transition: transform .35s cubic-bezier(.2,.8,.2,1);
    display: grid; grid-template-rows: auto auto 1fr; }
  .cajon.abierto { transform: none; }
  .cajon .cab { display: flex; align-items: center; gap: 14px; padding: 16px 24px 8px; }
  .cajon .cab h2 { font-size: 22px; } .cajon .cab .sub { color: var(--tinta-3); font-size: 13px; }
  .cajon .cab .cerrar { margin-left: auto; }
  .cajon .tabs { padding: 0 24px 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .cajon .dentro { overflow: auto; padding: 4px 24px 28px; min-height: 0; }
  .personas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; align-items: start; }
  .per { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
  .per .cabp { display: flex; align-items: center; gap: 10px; }
  .per .cabp img, .per .cabp .ini { width: 36px; height: 36px; border-radius: 50%; background: var(--olivo-300); display: grid; place-items: center; font-weight: 700; color: var(--carbon); }
  .per h3 { font-size: 18px; } .per .cabp small { display: block; color: var(--tinta-3); font-size: 12px; }
  .per .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .per .nums div { background: var(--tarjeta-2); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; color: var(--tinta-2); }
  .per .nums b { display: block; font-family: var(--serif); font-size: 28px; line-height: 1.05; color: var(--tinta); }
  .per .nums .rojo b { color: var(--estancado); }
  .per .barra { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--tarjeta-2); }
  .per ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .per li { background: var(--tarjeta-2); border-radius: 8px; padding: 7px 10px; font-size: 13px; display: grid; gap: 2px; border-left: 4px solid var(--olivo-500); }
  .per li[data-deal] { cursor: pointer; }
  .per li.v1 { border-left-color: var(--espera); } .per li.v2, .per li.v3 { border-left-color: var(--estancado); }
  .per li .lin { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .per li .lin b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .per li .txt { color: var(--tinta-2); font-size: 12.5px; white-space: pre-line; }
  .fecha { font-size: 11.5px; font-weight: 700; white-space: nowrap; color: var(--tinta-2); }
  .fecha.critico { color: var(--estancado); } .fecha.hoy { color: var(--acento); }
  .vacio { color: var(--tinta-3); padding: 20px 0; }

  /* Tooltip, detalle y celebración */
  #tip { position: fixed; z-index: 60; pointer-events: none; background: var(--carbon); color: #FCFCFC; border-radius: 9px; padding: 8px 11px; font-size: 12.5px; line-height: 1.4;
    max-width: 340px; box-shadow: 0 8px 24px rgb(0 0 0 / .25); opacity: 0; transition: opacity .12s; }
  #tip.on { opacity: 1; } #tip b { font-weight: 700; } #tip small { opacity: .7; display: block; margin-top: 3px; }
  dialog { border: 0; border-radius: 18px; padding: 0; width: min(580px, calc(100vw - 32px)); max-height: 86vh; background: var(--tarjeta); color: var(--tinta); box-shadow: 0 30px 80px rgb(0 0 0 / .3); }
  dialog::backdrop { background: rgb(28 33 28 / .45); }
  .det { padding: 22px 24px; display: grid; gap: 14px; }
  .det .cabd { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
  .det h3 { font-size: 22px; }

<script type="module">
import { cargarDatos, usd, fecha, hora, esc, estadoNextStep, etapaCorta } from '/common.js';

const $ = (s) => document.querySelector(s);
const DIA = 86_400_000;
const ROTACION_MS = 30_000;
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const COLUMNAS = [
  { t: 'Qualification', etapas: ['Qualification'] },
  { t: '1ª reunión', etapas: ['First meeting held'] },
  { t: 'Build consensus', etapas: ['Build consensus'] },
  { t: 'Negotiation', etapas: ['Negotiation'] },
  { t: 'PoC', etapas: ['PoC preparation', 'PoC execution'] },
  { t: 'Firmado', etapas: ['Contract signature', 'Ready for use 🎉'], meta: true },
];
const columnaDe = (etapa) => COLUMNAS.findIndex((c) => c.etapas.includes(etapa));
const FUERA_DE_OWNERS = ['Esteban']; // pedido de Beto, 20-nov: Esteban no va en Pipeline por owner
const params = new URLSearchParams(location.search);
// Modo TV (pedido de Beto, 21-nov: "que se vea exacto como en el computador").
// En la TV el dashboard se arma en un lienzo fijo del tamaño del área visible del navegador en el MacBook de Beto
// (1470×830) y se agranda entero hasta llenar la pantalla, con márgenes si la proporción no calza. Así se ve igual
// que en el computador sin importar el tamaño que reporte el navegador de la TV.
// Se activa con /tv (o ?tv), en navegadores de Android TV / Google TV, y en pantallas que no son de computador
// (más anchas que 1700 px, o apaisadas de menos de 1100 px). En el computador no se toca nada.
// ?pantalla muestra lo que reporta la pantalla.
const BASE_W = 1470, BASE_H = 830, VERSION = '27-nov-e';
let Z = 1, OFF_X = 0, OFF_Y = 0, MODO_TV = false;
const UA_TV = /GoogleTV|Google TV|Android TV|AndroidTV|BRAVIA|SmartTV|SMART-TV|Tizen|Web0S|webOS|CrKey|AFT[A-Z]|\bTV\b|Android(?!.*Mobile)/i.test(navigator.userAgent);
function escalar() {
  const w = innerWidth, h = innerHeight;
  const apaisada = w > h;
  MODO_TV = apaisada && (params.has('tv') || UA_TV || w > 1700 || (w >= 600 && w < 1100));
  const b = document.body.style, r = document.documentElement.style;
  if (!MODO_TV) {
    Z = 1; OFF_X = OFF_Y = 0;
    Object.assign(b, { width: '', height: '', transform: '', transformOrigin: '', position: '', left: '', top: '' });
    r.overflow = ''; r.background = '';
  } else {
    Z = Math.min(w / BASE_W, h / BASE_H);
    OFF_X = Math.max(0, (w - BASE_W * Z) / 2); OFF_Y = Math.max(0, (h - BASE_H * Z) / 2);
    Object.assign(b, { width: `${BASE_W}px`, height: `${BASE_H}px`, transform: `scale(${Z})`, transformOrigin: '0 0', position: 'absolute', left: `${OFF_X}px`, top: `${OFF_Y}px` });
    r.overflow = 'hidden'; r.background = getComputedStyle(document.body).backgroundColor;
  }
  document.body.classList.toggle('modo-tv', MODO_TV);
  document.body.classList.toggle('angosto', (MODO_TV ? BASE_W : w) < 1650);
  const d = document.getElementById('version');
  if (d) d.textContent = params.has('pantalla') ? `v${VERSION} · ${w}×${h} · ×${Z.toFixed(2)}${MODO_TV ? ' · TV' : ''}` : '';
}
escalar();


let datos = null;
let ordenEtapa = {};
const ord = (e) => ordenEtapa[e] ?? -1;

// ---------- Estado: filtros, opciones de cada gráfico, diapositiva ----------
const guardado = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const filtro = Object.assign({ owner: 'Todos', origen: 'Todos', sector: 'Todos' }, guardado('vu-filtro', {}));
// Valores por defecto de cada opción: muestran todo (pedido de Beto, 21-nov). Lo que se aleja de esto se marca en ámbar.
const DEF_OP = {
  'camino.vista': 'firmado', 'camino.2026': 'todo',
  'act.metrica': 'nuevos', 'act.medida': 'n',
  'kanban.mov': 'todo',
  'ev.medida': 'arr', 'ev.grupo': 'etapa', 'ev.sem': '8',
  'perm.curso': 'todas', 'perm.comparar': 'no', 'perm.extremos': 'sin',
  'tgp.periodo': 'todo',
  'paises.vista': 'anio',
  // Cohortes (rediseño 26-nov). Medida: % de deals o % del ARR (Beto, 24-nov: todo en porcentaje).
  'coh.vista': 'chile', 'coh.hito': 'consenso', 'coh.medida': 'pct', 'coh.filas': 'quincena', 'coh.seg': 'privado', 'coh.pais': 'Todos',
  'pend.tab': 'resumen',
  'mapa.deals': 'todos', 'mapa.color': 'estado', 'mapa.pintar': 'arr',
};
// 'vu-op2': las opciones guardadas antes del 21-nov se descartan, para que todos partan viendo todo.
const op = Object.assign({}, DEF_OP, guardado('vu-op2', {}));
// Cohortes: las opciones guardadas que ya no existen (homologado, un país a la vez, por owner…) vuelven a su valor por defecto.
for (const [k, vs] of Object.entries({ 'coh.vista': ['chile', 'paises'], 'coh.hito': ['reunion', 'consenso', 'negociacion', 'pocprep', 'pocejec', 'firma'], 'coh.medida': ['pct', 'arr', 'mm'], 'coh.filas': ['semana', 'quincena', 'mes'], 'coh.seg': ['privado', 'publico', 'todos'], 'coh.pais': ['Todos', 'Colombia', 'Brasil', 'Argentina', 'México'] })) if (!vs.includes(op[k])) op[k] = DEF_OP[k];
let actual = Math.max(0, Number(location.hash.slice(1)) - 1 || 0);
let auto = params.has('auto');
let rotacion = null;

// Un deal pasa los filtros de arriba. En la diapositiva de TGP se ignora el filtro de origen (compara TGP con el equipo).
function pasa(d, { sinOrigen = false } = {}) {
  return (filtro.owner === 'Todos' || d.owner === filtro.owner) &&
    (sinOrigen || filtro.origen === 'Todos' || (filtro.origen === 'TGP') === d.tgp) &&
    (filtro.sector === 'Todos' || d.sector === filtro.sector);
}
const D = (o) => datos.deals.filter((d) => pasa(d, o));
const hayFiltro = () => filtro.owner !== 'Todos' || filtro.origen !== 'Todos' || filtro.sector !== 'Todos';
const textoFiltro = () => hayFiltro() ? [filtro.owner !== 'Todos' && filtro.owner, filtro.origen !== 'Todos' && (filtro.origen === 'TGP' ? 'de TGP' : 'del equipo'), filtro.sector !== 'Todos' && filtro.sector.toLowerCase()].filter(Boolean).join(' · ') : '';
const suma = (xs, k = 'arrUsd') => xs.reduce((s, d) => s + (d[k] ?? 0), 0);
const esNuevo = (d) => Date.now() - new Date(d.creado) < 7 * DIA;
const fechaT = (f) => new Date(f.length === 10 ? f + 'T12:00:00' : f).getTime();

function htmlFiltros() {
  const grupo = (k, etq, vals) => `<div class="grupo"><span>${etq}</span><div class="seg ${filtro[k] !== 'Todos' ? 'cambiado' : ''}">${vals.map(([v, t]) => `<button data-filtro="${k}" data-v="${v}" aria-pressed="${filtro[k] === v}">${t}</button>`).join('')}</div></div>`;
  return grupo('owner', 'Owner', [['Todos', 'Todos'], ['Tomi', 'Tomi'], ['Anto', 'Anto'], ['Beto', 'Beto']])
    + grupo('origen', 'Origen', [['Todos', 'Todos'], ['TGP', 'TGP'], ['Equipo', 'Equipo']])
    + grupo('sector', 'Sector', [['Todos', 'Todos'], ['Público', 'Público'], ['Privado', 'Privado']])
    + (hayFiltro() ? `<button class="btn reset" data-limpiar title="Volver a ver todos los deals">✕ Quitar filtros</button>` : '');
}
// Botones de opciones de un gráfico.
const marcaOp = (k) => k in DEF_OP && op[k] !== DEF_OP[k] && !k.startsWith('pend.') && k !== 'coh.vista';
const ops = (k, vals) => `<div class="seg ${marcaOp(k) ? 'cambiado' : ''}" ${marcaOp(k) ? 'title="Cambiado: no es la vista por defecto"' : ''}>${vals.map(([v, t]) => `<button data-op="${k}" data-v="${v}" aria-pressed="${op[k] === v}">${t}</button>`).join('')}</div>`;

// ---------- Listas para el doble clic y tooltips ----------
const listas = new Map();
let nLista = 0;
function lista(titulo, sub, deals) { const k = 'l' + nLista++; listas.set(k, { titulo, sub, ids: deals.map((d) => d.id) }); return k; }
// Atributos para un elemento con dato al pasar el mouse y lista con doble clic.
const dato = (tip, titulo, sub, deals) => `data-tip="${esc(tip)}"${deals?.length ? ` data-lista="${lista(titulo, sub, deals)}"` : ''}`;

// ---------- Semanas ----------
function lunes(t) { const x = new Date(t); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function semanas(n) {
  const l = lunes(Date.now());
  return Array.from({ length: n }, (_, i) => {
    const desde = new Date(l); desde.setDate(l.getDate() - (n - 1 - i) * 7);
    const hasta = new Date(desde); hasta.setDate(desde.getDate() + 7);
    const ult = i === n - 1;
    return { desde: desde.getTime(), hasta: hasta.getTime(), ult, etq: `${desde.getDate()}-${MESES[desde.getMonth()]}`, nombre: ult ? 'esta semana' : `semana del ${desde.getDate()}-${MESES[desde.getMonth()]}` };
  });
}
const enSemana = (f, s) => { if (!f) return false; const t = fechaT(f); return t >= s.desde && t < s.hasta; };
// Historial de etapas ordenado; etapa de un deal en un momento dado.
const histDe = (d) => (d._h ??= [...(d.hist ?? [])].filter((h) => h[0] && h[1]).sort((a, b) => fechaT(a[1]) - fechaT(b[1])));
function etapaAl(d, t) {
  if (fechaT(d.creado) > t) return null;
  let e = null;
  for (const [et, desde] of histDe(d)) { if (fechaT(desde) <= t) e = et; else break; }
  return e ?? (histDe(d).length ? null : d.etapa);
}
const transiciones = (d) => histDe(d).slice(1).map((h, i) => ({ de: histDe(d)[i][0], a: h[0], t: fechaT(h[1]) }));
const llego = (d, k) => ord(d.etapa) >= k || histDe(d).some(([e]) => ord(e) >= k);
const probDe = (e) => datos.etapas.find((x) => x.nombre === e)?.prob ?? 0;

// ---------- Gráfico de barras apiladas (actividad, demanda, evolución) ----------
// cols: [{ etq, tenue, segs: [{ v, color, tip, titulo, deals }], tip, titulo, deals }]
function svgBarras(ancho, alto, cols, fmt) {
  const m = { t: 24, r: 6, b: 28, l: 6 };
  const W = ancho - m.l - m.r, H = alto - m.t - m.b;
  const max = Math.max(1e-9, ...cols.map((c) => c.segs.reduce((s, x) => s + x.v, 0)));
  const paso = W / cols.length, bw = Math.min(64, paso * 0.62);
  return `<svg viewBox="0 0 ${ancho} ${alto}" role="img">
    <line class="eje" x1="${m.l}" x2="${m.l + W}" y1="${m.t + H}" y2="${m.t + H}"/>
    ${cols.map((c, i) => {
      const cx = m.l + paso * i + paso / 2;
      let y0 = m.t + H;
      const tot = c.segs.reduce((s, x) => s + x.v, 0);
      const segs = c.segs.map((s) => {
        const h = (s.v / max) * H;
        if (h <= 0) return '';
        y0 -= h;
        return `<rect x="${cx - bw / 2}" y="${y0}" width="${bw}" height="${Math.max(0, h - 1.5)}" rx="3" fill="${s.color}" ${dato(s.tip, s.titulo, s.sub ?? '', s.deals)}/>`;
      }).join('');
      return `<g style="opacity:${c.tenue ? 0.72 : 1}">
        <rect x="${cx - paso / 2}" y="${m.t}" width="${paso}" height="${H}" fill="transparent" ${dato(c.tip, c.titulo, c.sub ?? '', c.deals)}/>
        ${segs}<text x="${cx}" y="${y0 - 7}" text-anchor="middle" style="font-weight:700;fill:var(--tinta)">${fmt(tot)}</text>
        <text x="${cx}" y="${alto - 8}" text-anchor="middle">${esc(c.etq)}</text></g>`;
    }).join('')}
  </svg>`;
}
const leyenda = (items) => `<div class="leyenda">${items.map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;
const fmtN = (v) => String(Math.round(v));
const fmtUsd = (v) => (v ? usd(v) : '0');

// =====================================================================
// Diapositivas
// =====================================================================
const card = (titulo, sub, opsHtml, cuerpo, pie = '') => `<section class="card"><header><h2>${titulo}</h2><span class="sub">${sub}</span><div class="ops">${opsHtml}</div></header><div class="cuerpo">${cuerpo}</div>${pie}</section>`;

// ---------- 1. Camino al millón (fusiona la franja de ARR firmado y "Pipeline vs meta" de la torre) ----------
function diapoCamino() {
  const meta = datos.meta.metaUsd;
  const firmados = D().filter((d) => d.firmado);
  const firmado = suma(firmados);
  const abiertos = D().filter((d) => d.abierto);
  const falta = Math.max(0, meta - firmado);
  const dias = datos.meta.diasAlCierre;
  const pct = Math.round((firmado / meta) * 100);
  const kpis = `<div class="kpis">
    <div class="kpi grande"><small>ARR firmado 2026</small><b>${usd(firmado)}</b></div>

// ¿Alcanza lo avanzado? Firmado más cada etapa, de la más avanzada a la más temprana, contra la meta. Bruto y ponderado.

  return {

// ---------- 5. Evolución del pipeline ----------
const COLOR_ETAPA = ['var(--olivo-200)', 'var(--olivo-300)', 'var(--olivo-500)', 'var(--olivo-700)', 'var(--verde)', 'var(--carbon)'];
function gruposEvolucion() {
  if (op['ev.grupo'] === 'owner') {
    return [['Tomi', 'var(--verde)'], ['Anto', 'var(--olivo-500)'], ['Beto', 'var(--mineral)'], ['Otros', 'var(--olivo-300)']]
      .map(([t, color]) => ({ t, color, es: (d) => (['Tomi', 'Anto', 'Beto'].includes(d.owner) ? d.owner : 'Otros') === t }));
  }
  if (op['ev.grupo'] === 'origen') return [{ t: 'Equipo', color: 'var(--equipo)', es: (d) => !d.tgp }, { t: 'TGP', color: 'var(--tgp)', es: (d) => d.tgp }];
  return COLUMNAS.map((c, j) => ({ t: c.t, color: j === 5 ? 'var(--tinta)' : COLOR_ETAPA[j], es: (d, e) => c.etapas.includes(e) }));
}
function diapoEvolucion() {
  const nSem = Number(op['ev.sem']);
  const ss = semanas(nSem);
  const grupos = gruposEvolucion();
  const medida = op['ev.medida'];
  const val = (xs) => (medida === 'n' ? xs.length : xs.reduce((s, x) => s + (medida === 'pond' ? x.d.arrUsd * (x.d.firmado && ord(x.e) >= ord('Contract signature') ? 1 : probDe(x.e)) : x.d.arrUsd), 0));
  const f = medida === 'n' ? fmtN : fmtUsd;
  const nomMedida = { arr: 'ARR', n: 'deals', pond: 'ARR ponderado' }[medida];
  const fotos = ss.map((s) => {
    const corte = Math.min(s.hasta, Date.now());
    const xs = [];
    for (const d of D()) { const e = etapaAl(d, corte); if (e && ord(e) >= 0) xs.push({ d, e }); }
    return { s, xs };
  });
  const cols = fotos.map(({ s, xs }) => {
    const nombre = s.ult ? 'hoy' : `cierre del ${new Date(s.hasta - DIA).getDate()}-${MESES[new Date(s.hasta - DIA).getMonth()]}`;
    return { etq: s.ult ? 'hoy' : s.etq, tip: `<b>Pipeline al ${nombre}</b><br>${f(val(xs))} (${nomMedida}) · ${xs.length} deals<small>Doble clic para ver los deals</small>`, titulo: `Pipeline al ${nombre}`, deals: xs.map((x) => x.d),
      segs: grupos.map((g) => { const ys = xs.filter((x) => g.es(x.d, x.e)); return { v: val(ys), color: g.color, tip: `<b>${g.t} · ${nombre}</b><br>${f(val(ys))} (${nomMedida}) · ${ys.length} deals`, titulo: `${g.t} · pipeline al ${nombre}`, deals: ys.map((x) => x.d) }; }) };
  });
  const v = (c) => c.segs.reduce((s, x) => s + x.v, 0);
  const a = cols.at(-1), b = cols[Math.max(0, cols.length - 5)];
  const d = v(a) - v(b);
  return {
    html: `<div class="diapo una">${card('Evolución del pipeline', 'cómo estaba el pipeline al cierre de cada semana (con el historial de etapas de Attio)',
      ops('ev.medida', [['arr', 'ARR'], ['pond', 'Ponderado'], ['n', 'Deals']]) + ops('ev.grupo', [['etapa', 'Por etapa'], ['owner', 'Por owner'], ['origen', 'Por origen']]) + ops('ev.sem', [['8', '8 semanas'], ['12', '12 semanas']]),
      '<div class="grafico" id="g-ev"></div>',
      `<div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-top:8px">${leyenda(grupos.map((g) => [g.color, g.t]))}
        <p class="resumen" style="margin:0">Hoy: <b>${f(v(a))}</b> · hace 4 semanas: ${f(v(b))} (${d >= 0 ? '▲' : '▼'} ${f(Math.abs(d))})</p></div>
        <p class="nota">Cada deal cuenta con su ARR de hoy, porque Attio no guarda el ARR de semanas anteriores. Incluye firmados; no incluye Closed lost. Ponderado: ARR por la probabilidad de la etapa en que estaba.</p>`)}</div>`,

// ---------- 6. Días de permanencia por etapa ----------
function mediana(xs) { if (!xs.length) return 0; const s = [...xs].sort((a, b) => a - b), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2); }
function p75(xs) { if (!xs.length) return 0; const s = [...xs].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(s.length * 0.75))]; }
function estadias(deals) {
  const r = {};
  for (const d of deals) {
    const h = histDe(d);
    h.forEach(([e, desde], i) => {
      if (ord(e) < 0 || e === 'Ready for use 🎉') return;
      const enCurso = !h[i + 1];
      if (enCurso && op['perm.curso'] === 'cerradas') return;
      const fin = enCurso ? Date.now() : fechaT(h[i + 1][1]);
      (r[e] ??= []).push({ d, dias: Math.max(0, Math.floor((fin - fechaT(desde)) / DIA)), enCurso });
    });
  }
  return r;
}
// Casos extremos (Beto, 23-nov): fuera las estadías terminadas de 0 días (etapa saltada o dos cambios el mismo día)
// y las muy largas, sobre p75 + 1,5 × (p75 − p25) de su etapa. El límite se calcula solo, por etapa y por serie.
function depurar(xs) {
  if (op['perm.extremos'] === 'con') return { xs, ceros: [], largos: [] };
  const ceros = xs.filter((y) => y.dias === 0 && !y.enCurso);
  const resto = xs.filter((y) => !(y.dias === 0 && !y.enCurso));
  if (resto.length < 4) return { xs: resto, ceros, largos: [] };
  const s = resto.map((y) => y.dias).sort((a, b) => a - b), q = (p) => s[Math.min(s.length - 1, Math.floor(s.length * p))];
  const lim = q(0.75) + 1.5 * (q(0.75) - q(0.25));
  return { xs: resto.filter((y) => y.dias <= lim), ceros, largos: resto.filter((y) => y.dias > lim).sort((a, b) => b.dias - a.dias) };
}
function diapoPermanencia() {
  const etapas = datos.etapas.filter((e) => e.nombre !== 'Ready for use 🎉');
  const series = op['perm.comparar'] === 'origen'
    ? [{ t: 'Equipo', color: 'var(--equipo)', r: estadias(D().filter((d) => !d.tgp)) }, { t: 'TGP', color: 'var(--tgp)', r: estadias(D().filter((d) => d.tgp)) }]
    : [{ t: 'Todos', color: 'var(--acento)', r: estadias(D()) }];
  const filas = etapas.map((e) => ({ e, s: series.map((x) => { const { xs, ceros, largos } = depurar(x.r[e.nombre] ?? []); const ds = xs.map((y) => y.dias); return { ...x, xs, ceros, largos, med: mediana(ds), p75: p75(ds), n: xs.length, curso: xs.filter((y) => y.enCurso).length }; }) }));
  const max = Math.max(10, ...filas.flatMap((f) => [f.e.limite ?? 0, ...f.s.map((x) => x.p75)])) * 1.08;
  const todas = estadias(D());
  const fuera = filas.reduce((t, f) => t + f.s.reduce((u, x) => u + x.ceros.length + x.largos.length, 0), 0);
  const peor = filas.map((f) => { const ds = depurar(todas[f.e.nombre] ?? []).xs.map((y) => y.dias); return { f, med: mediana(ds), n: ds.length }; }).filter((x) => x.f.e.limite && x.n >= 3).map((x) => ({ ...x, r: x.med / x.f.e.limite })).sort((a, b) => b.r - a.r)[0];
  return {
    html: `<div class="diapo una">${card('Días de permanencia por etapa', 'cuántos días se queda un deal en cada etapa: la barra fuerte es la mediana (la mitad de los deals sale antes), la clara llega al p75 (3 de cada 4) y el rombo es lo esperado',
      ops('perm.curso', [['todas', 'Incluye las que siguen en curso'], ['cerradas', 'Solo estadías terminadas']]) + ops('perm.comparar', [['no', 'Todos juntos'], ['origen', 'TGP vs equipo']]) + ops('perm.extremos', [['sin', 'Sin casos extremos'], ['con', 'Incluir casos extremos']]),
      '<div class="grafico" id="g-perm"></div>',
      `<div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-top:8px"><div class="leyenda">${series.map((x) => `<span><i style="background:${x.color}"></i>Mediana${x.t === 'Todos' ? '' : ' ' + x.t}</span><span><i style="background:${x.color};opacity:.32"></i>hasta el p75${x.t === 'Todos' ? '' : ' ' + x.t}</span>`).join('')}<span>◆ días esperados de la etapa</span></div>
        ${peor ? `<p class="resumen" style="margin:0">Más lenta frente a lo esperado: <b>${esc(etapaCorta(peor.f.e.nombre))}</b>, mediana ${peor.med} días contra ${peor.f.e.limite} esperados (todos los deals).${fuera ? ` Sin ${fuera} casos extremos.` : ''}</p>` : ''}</div>`)}</div>`,
    pintar(el) {
      const g = el.querySelector('#g-perm');
      const ancho = g.clientWidth, alto = g.clientHeight;
      const m = { t: 8, r: 230, b: 24, l: 140 };
      const W = ancho - m.l - m.r, filaH = (alto - m.t - m.b) / filas.length;
      const x = (v) => m.l + (v / max) * W;
      const bh = Math.min(22, (filaH - 10) / series.length);
      const pasoT = [5, 10, 15, 20, 30, 45, 60, 90].find((p) => max / p <= 7) ?? 120;
      const ticks = Array.from({ length: Math.floor(max / pasoT) + 1 }, (_, i) => i * pasoT);
      g.innerHTML = `<svg viewBox="0 0 ${ancho} ${alto}" role="img" aria-label="Días por etapa">
        ${ticks.map((t) => `<line class="eje" x1="${x(t)}" x2="${x(t)}" y1="${m.t}" y2="${alto - m.b}" stroke-dasharray="2 4"/><text x="${x(t)}" y="${alto - 6}" text-anchor="middle">${t} d</text>`).join('')}
        ${filas.map((f, i) => {
          const y0 = m.t + i * filaH + (filaH - bh * series.length) / 2;
          return `<text x="${m.l - 12}" y="${m.t + i * filaH + filaH / 2 + 4}" text-anchor="end" style="font-weight:600;fill:var(--tinta)">${esc(etapaCorta(f.e.nombre))}</text>
            ${f.e.limite ? `<line x1="${x(f.e.limite)}" x2="${x(f.e.limite)}" y1="${y0 - 6}" y2="${y0 + bh * series.length + 2}" stroke="var(--tinta-2)" stroke-width="1.5" stroke-dasharray="3 3" style="pointer-events:none"/><path d="M${x(f.e.limite)},${y0 - 12} l5,5 l-5,5 l-5,-5z" fill="var(--tinta)" style="pointer-events:none"/><text x="${x(f.e.limite) + 8}" y="${y0 - 4}" style="font-size:11px;fill:var(--tinta-2);pointer-events:none">esperado ${f.e.limite} d</text>` : ''}
            ${f.s.map((s, j) => {
              const yy = y0 + j * bh;
              const tip = `<b>${esc(etapaCorta(f.e.nombre))}${series.length > 1 ? ` · ${s.t}` : ''}</b><br>Mediana ${s.med} días · p75 ${s.p75} días<br>${s.n} estadías (${s.curso} en curso)${s.ceros.length + s.largos.length ? `<br>Fuera: ${[s.largos.length ? `${s.largos.length} muy ${s.largos.length === 1 ? 'larga' : 'largas'} (${s.largos.slice(0, 3).map((y) => `${esc(y.d.cuenta)} ${y.dias} d`).join(', ')}${s.largos.length > 3 ? '…' : ''})` : '', s.ceros.length ? `${s.ceros.length} de 0 días` : ''].filter(Boolean).join(' · ')}` : ''}${f.e.limite ? `<br>Esperado: ${f.e.limite} días` : ''}<small>Doble clic para ver los deals</small>`;
              return `<rect x="${m.l}" y="${yy}" width="${Math.max(0, x(s.p75) - m.l)}" height="${bh - 3}" rx="3" fill="${s.color}" fill-opacity=".32" style="pointer-events:none"/>
                <rect x="${m.l}" y="${yy}" width="${Math.max(0, x(s.med) - m.l)}" height="${bh - 3}" rx="3" fill="${s.color}" ${dato(tip, `${etapaCorta(f.e.nombre)}${series.length > 1 ? ` · ${s.t}` : ''}`, 'Deals que pasaron por esta etapa', [...new Set(s.xs.map((y) => y.d))])}/>
                <line x1="${x(s.p75)}" x2="${x(s.p75)}" y1="${yy - 3}" y2="${yy + bh}" stroke="${s.color}" stroke-width="3.5" stroke-linecap="round" style="pointer-events:none"/>
                <text x="${ancho - m.r + 14}" y="${yy + bh / 2 + 2}" style="font-size:${series.length > 1 ? 11.5 : 12}px">${series.length > 1 ? s.t + ': ' : 'mediana '}${s.med} d · p75 ${s.p75} d <tspan style="fill:var(--tinta-3)">(n=${s.n})</tspan></text>`;
            }).join('')}`;
        }).join('')}
      </svg>`;
    },

}

// ---------- 7. Pipeline por owner ----------
function diapoOwners() {
  const abiertos = D().filter((d) => d.abierto && !FUERA_DE_OWNERS.includes(d.owner));

        <td>${f.est.length ? `${esc(f.dondeTraba[0])} (${f.dondeTraba[1]})${f.motivo?.[0] ? ` · <small>sobre todo: ${esc(f.motivo[0].toLowerCase())}</small>` : ''}<br><small>Primero: <span data-deal="${f.urgente.id}" style="cursor:pointer;text-decoration:underline">${esc(f.urgente.cuenta)}</span> (${usd(f.urgente.arrUsd)})</small>` : '<small>Nada estancado</small>'}</td></tr>`).join('')}</tbody></table></div>`,

// ---------- 8. Calidad e impacto de TGP ----------
function diapoTGP() {
  const per = op['tgp.periodo'];
  const desde = per === 'todo' ? 0 : lunes(Date.now()).getTime() - (Number(per) - 1) * 7 * DIA;
  const base = D({ sinOrigen: true }).filter((d) => fechaT(d.creado) >= desde);
  const kReu = ord('First meeting held'), kBC = ord('Build consensus');
  const fila = (t, xs) => {
    const reunionHecha = (d) => d.primeraReunion && fechaT(d.primeraReunion) <= Date.now();
    const reu = xs.filter((d) => llego(d, kReu) || reunionHecha(d));
    const bc = xs.filter((d) => llego(d, kBC));
    const firm = xs.filter((d) => d.firmado);
    const perd = xs.filter((d) => d.perdido);
    const ab = xs.filter((d) => d.abierto);
    const est = ab.filter((d) => d.estancado);
    const conArr = xs.filter((d) => d.arrUsd > 0);
    const aReu = reu.map((d) => { const h = histDe(d).find(([e]) => ord(e) >= kReu); const t1 = h ? fechaT(h[1]) : reunionHecha(d) ? fechaT(d.primeraReunion) : null; return t1 ? Math.max(0, Math.round((t1 - fechaT(d.creado)) / DIA)) : null; }).filter((v) => v != null);
    return { t, xs, reu, bc, firm, perd, ab, est, conArr, sinArr: xs.length - conArr.length, diasReu: mediana(aReu), nReu: aReu.length };
  };
  const filas = [fila('TGP', base.filter((d) => d.tgp)), fila('Equipo', base.filter((d) => !d.tgp))];
  const tot = fila('Total', base);
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const cPct = (f, xs, de, titulo) => `<td class="num" ${dato(`<b>${f.t} · ${titulo}</b><br>${xs.length} de ${de.length} (${pct(xs.length, de.length)}%)<small>Doble clic para ver los deals</small>`, `${f.t} · ${titulo}`, 'Deals del período', xs)}><div class="pct"><span><b>${pct(xs.length, de.length)}%</b> <small>${xs.length}/${de.length}</small></span><span class="barra"><i style="width:${pct(xs.length, de.length)}%"></i></span></div></td>`;
  const cN = (f, xs, titulo, txt) => `<td class="num" ${dato(`<b>${f.t} · ${titulo}</b><br>${xs.length} deals · ${usd(suma(xs))}<small>Doble clic para ver los deals</small>`, `${f.t} · ${titulo}`, 'Deals del período', xs)}>${txt}</td>`;
  const tr = (f, clase = '') => `<tr class="${clase}"><td><b>${f.t}</b></td>${cN(f, f.xs, 'deals creados', f.xs.length)}${cPct(f, f.reu, f.xs, 'llegaron a 1ª reunión')}${cPct(f, f.bc, f.xs, 'llegaron a Build consensus o más')}
    ${cN(f, f.firm, 'firmados', `${f.firm.length} <small>· ${usd(suma(f.firm))}</small>`)}${cN(f, f.conArr, 'con ARR', `${usd(f.conArr.length ? suma(f.conArr) / f.conArr.length : 0)} <small>· ${f.sinArr} sin ARR</small>`)}
    ${cPct(f, f.est, f.ab, 'abiertos estancados')}${cPct(f, f.perd, f.xs, 'perdidos')}<td class="num">${f.nReu ? `${f.diasReu} d` : '—'}</td></tr>`;
  const [a, b] = filas;
  return {
    html: `<div class="diapo una">${card('Calidad e impacto de TGP', 'deals creados en el período, TGP contra el equipo (aquí no se aplica el filtro de origen)',
      ops('tgp.periodo', [['4', '4 semanas'], ['8', '8 semanas'], ['12', '12 semanas'], ['todo', 'Todo']]),

      + grupo('Owner', segFiltro('owner', [['Todos', 'Todos'], ['Tomi', 'Tomi'], ['Anto', 'Anto'], ['Beto', 'Beto']])) + fEtapa + fMedida + fPeriodo;
    titulo = `${esMM() ? 'ARR (millones de USD)' : `% ${deQue()}`} de cada cohorte que ya llegó a <b>${h.t}</b>, por ${u.t} ${desdeQue(h)}`;
    graf = '';
    pinta = (w, hh) => svgCohTri(w, hh, chile, h, per, u);
  }
  const ley = `<div class="coh-ley"><b>${vista === 'paises' ? op['coh.pais'] === 'Todos' ? 'Cada país contra Chile a la misma edad: verde = avanza más o más rápido que Chile.' : `Cada cohorte de ${esc(op['coh.pais'])} contra Chile a la misma edad: verde = avanza más o más rápido que Chile.` : 'Cada cohorte contra el promedio a la misma edad: verde = avanza más o más rápido.'}</b>${[2, 1, 0, -1, -2].map((k) => `<span><i style="background:${NIVEL_COH[k].color}"></i>${NIVEL_COH[k].t}</span>`).join('')}<span class="tenue"><i></i>tenue: pocos deals o aún en curso</span></div>`;
  const opsHtml = ops('coh.vista', [['chile', 'Chile'], ['paises', 'Chile vs países']]);
  return {
    html: `<div class="diapo una">${card('Cohortes', vista === 'paises' ? 'Chile contra los otros países, mismas fechas y mismo sector' : 'deals de Chile desde el lanzamiento, según cuándo entraron', opsHtml,
      `<div class="coh-v"><div class="coh-filtros coh-ops">${filtros}</div><p class="coh-tit">${titulo}</p><div class="grafico coh-g" id="g-coh">${graf}</div>${ley}</div>`)}</div>`,
    pintar(el) {
      const g = el.querySelector('#g-coh');
      if (pinta && g?.clientWidth) g.innerHTML = pinta(g.clientWidth, g.clientHeight);
    },
  };
}

// Celda: color por nivel (verde mejor, rojo peor, gris sin diferencia clara), el valor real encima y tenue si hay pocos deals o
// la cohorte aún está en curso (el número puede subir).
function celdaCoh(x, y, w, hh, v, niv, tenue, tip, lista) {
  const fs = Math.min(14, hh * 0.42, w * 0.3), c = NIVEL_COH[niv ?? 0];
  const caja = `x="${x + 1.5}" y="${y + 1.5}" width="${Math.max(1, w - 3)}" height="${Math.max(1, hh - 3)}" rx="4"`;
  let out = `<rect ${caja} fill="${c.color}" fill-opacity="${tenue ? 0.4 : 1}" ${tenue ? `stroke="${c.color}" stroke-dasharray="3 2"` : ''} ${dato(tip, ...lista)}/>`;
  if (w >= 22 && hh >= 12) out += `<text x="${x + w / 2}" y="${y + hh / 2 + fs * 0.36}" text-anchor="middle" style="font-size:${fs}px;font-weight:700;pointer-events:none;fill:${tenue ? 'var(--tinta-2)' : '#FFFFFF'}">${fmtCoh(v)}</text>`;
  return out;
}
const textoNivel = (niv) => (niv == null ? '' : `<br><b>${NIVEL_COH[niv].t}</b>${niv === 0 ? ' (la diferencia puede ser azar)' : ''}`);
const lineaMedida = (r) => (esMM() ? `US$ ${fmtMM(r.arrSi / 1e6)} MM de US$ ${fmtMM(r.arrBase / 1e6)} MM · ${r.num} de ${r.n} deals` : `${pct(r.p)} ${deQue()} · llegaron ${r.num} de ${r.n} deals`);

// Vista Chile y vista países (27-nov, Beto: "aplica lo mismo que hay en Chile a los otros países, pero mantenlo como cohortes"):
// una fila por cohorte, una columna por semana, quincena o mes desde su reloj. Celda = lo que ya llegó a la etapa a esa edad
// (acumulado: si a la semana 1 llegaron 5 de 10 y a la semana 2 otros 3, se ve 50% y luego 80%). Sin plazos fijos.
// Chile: cada celda contra el promedio de Chile a la misma edad (fila "Promedio"); a la derecha, "vs promedio".
// País: cada celda contra Chile a la misma edad (mismas fechas y mismo sector); abajo, el país y Chile con todas sus cohortes
// juntas; a la derecha, "vs Chile". Los deals de otros países vienen sin nombre: no hay lista al doble clic.
function svgCohTri(ancho0, alto, deals, h, per, u, comp = null) {
  const arr = porArr(), mm = esMM(), otro = !!comp;
  const filasDe = (ds0) => per.map((q) => { const ds = ds0.filter((d) => enQ(d, q)); return { q, ds, av: avance(ds, h) }; });
  const filas = filasDe(deals), filasC = otro ? filasDe(comp.deals) : null;
  const tope = Math.max(1, Math.min(u.max, Math.ceil((Date.now() - per[0].desde) / (u.dias * DIA))));
  const celdaR = (av, a) => { const r = av.en((a + 1) * u.dias); return r.n && r.obs && r.p != null ? r : null; };
  let A = 1;
  for (let a = 0; a < tope; a++) if (filas.some(({ av }) => celdaR(av, a))) A = a + 1;
  // Referencia por columna: en %, todas las cohortes juntas (Kaplan-Meier); en millones, el promedio de las cohortes con esa edad.
  const refsDe = (fs) => {
    const avT = avance(fs.flatMap((f) => f.ds), h);
    return Array.from({ length: A }, (_, a) => {
      if (!mm) { const r = celdaR(avT, a); return r ? { v: r.p, n: arr ? r.nArr : r.n } : null; }
      const vs = fs.map(({ av }) => celdaR(av, a)).filter(Boolean).map((r) => r.arrSi / 1e6);
      return vs.length ? { v: vs.reduce((s, x) => s + x, 0) / vs.length, n: vs.length } : null;
    });
  };
  const propios = refsDe(filas), refs = otro ? refsDe(filasC) : propios;
  const contra = otro ? 'Chile' : 'el promedio';
  const labelW = 118, headH = 30, minCell = 38, resW = 92;
  const ancho = Math.max(ancho0, labelW + A * minCell + resW), cellW = (ancho - labelW - resW - 8) / A, xR = labelW + A * cellW + 8;
  const nFilas = per.length + (otro ? 2 : 1), rowH = Math.max(16, Math.min(60, (alto - headH - 10) / nFilas));
  const ahora = Date.now(), fsL = Math.min(13, rowH * 0.5);
  let out = `<svg viewBox="0 0 ${ancho} ${alto}" ${ancho > ancho0 ? `style="width:${ancho}px;min-width:${ancho}px"` : ''} role="img" aria-label="Cohortes de ${otro ? esc(comp.nombre) : 'Chile'}">`;
  out += `<text x="0" y="${headH - 10}" style="font-size:11px;fill:var(--tinta-3)">${mm ? 'Cohorte · ARR (US$ MM)' : 'Cohorte · deals'}</text>`;
  for (let a = 0; a < A; a++) out += `<text x="${labelW + a * cellW + cellW / 2}" y="${headH - 10}" text-anchor="middle" style="font-size:11px;fill:var(--tinta-3)">${a === 0 ? `${u.uno} 1` : a + 1}</text>`;
  out += `<text x="${xR + resW / 2}" y="${headH - 10}" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--tinta-2)">vs ${otro ? 'Chile' : 'promedio'}</text>`;
  filas.forEach(({ q, ds, av }, i) => {
    const y = headH + i * rowH, enCurso = q.hasta > ahora, difs = [];
    const tipQ = `<b>Cohorte ${q.etq}${enCurso ? ' (en curso)' : ''}</b><br>${ds.length} deals · ${usd(suma(ds))}${otro ? '' : '<small>Doble clic para ver los deals</small>'}`;
    out += `<text x="0" y="${y + rowH / 2 + 4}" style="font-size:${fsL}px;font-weight:600;fill:var(--tinta)" ${otro ? dato(tipQ) : dato(tipQ, `Cohorte ${q.etq}`, 'Deals de la cohorte', ds)}>${q.etq} <tspan style="font-weight:400;fill:var(--tinta-3)">${mm ? fmtMM(suma(ds) / 1e6) : ds.length}</tspan></text>`;
    if (ds.length && !celdaR(av, 0)) out += `<text x="${labelW + 8}" y="${y + rowH / 2 + 4}" style="font-size:11px;fill:var(--tinta-3)">recién entraron: aún sin dato</text>`;
    for (let a = 0; a < A; a++) {
      const r = celdaR(av, a);
      if (!r) continue;
      const v = valorCoh(r), ref = refs[a]?.v ?? null, n = arr ? r.nArr : r.n, niv = nivelCoh(v, ref, n);
      const edad = `${a + 1} ${a ? u.t : u.uno}`, tenue = provisional(r) || n < N_MIN_CELDA;
      if (ref != null && !tenue) difs.push({ d: v - ref, niv });
      const tip = `<b>${otro ? `${esc(comp.nombre)} · ` : ''}Cohorte ${q.etq} · ${edad} ${desdeQue(h)}</b><br>Llegó a ${h.t}: ${lineaMedida(r)}${ref != null ? `<br>${otro ? 'Chile' : 'Promedio'} a esta edad: ${fmtCoh(ref)} → <b>${difCoh(v - ref)}</b>` : ''}${textoNivel(niv)}${r.pend ? `<br>${r.pend} aún no cumple${r.pend > 1 ? 'n' : ''} esa edad: puede subir` : ''}${otro ? '' : '<small>Doble clic para ver los que llegaron</small>'}`;
      out += celdaCoh(labelW + a * cellW, y, cellW, rowH, v, niv, tenue, tip, otro ? [] : [`Cohorte ${q.etq} · llegaron a ${h.t} en ${edad}`, `${r.num} de ${r.n} deals`, r.si]);
    }
    // Resumen de la cohorte: diferencia promedio con la referencia de cada columna (solo celdas firmes) y su nivel típico.
    if (difs.length) {
      const d = difs.reduce((s, x) => s + x.d, 0) / difs.length, m = difs.reduce((s, x) => s + x.niv, 0) / difs.length;
      const niv = m >= 1.5 ? 2 : m >= 0.5 ? 1 : m > -0.5 ? 0 : m > -1.5 ? -1 : -2, c = NIVEL_COH[niv];
      out += `<text x="${xR + resW / 2}" y="${y + rowH / 2 + 5}" text-anchor="middle" style="font-size:${Math.min(14, rowH * 0.45)}px;font-weight:800;fill:${niv === 0 ? 'var(--tinta-3)' : c.color}" ${dato(`<b>Cohorte ${q.etq} contra ${contra}</b><br>En promedio ${difCoh(d)} en ${difs.length} ${difs.length > 1 ? 'columnas' : 'columna'} firme${difs.length > 1 ? 's' : ''}<br><b>${c.t}</b>`)}>${niv > 0 ? '▲' : niv < 0 ? '▼' : '='} ${difCoh(d)}</text>`;
    }
  });
  // Filas de abajo. Chile: "Promedio" (la referencia del color). País: el país y Chile con todas sus cohortes juntas; el del país, con
  // el color de su diferencia con Chile.
  const yP = headH + per.length * rowH + 6, fsV = Math.min(14, rowH * 0.42, cellW * 0.3);
  out += `<line x1="0" x2="${xR - 8}" y1="${yP - 3}" y2="${yP - 3}" stroke="var(--borde)"/>`;
  const filaRef = (y, etq, color, vals, conColor) => {
    let s = `<text x="0" y="${y + rowH / 2 + 4}" style="font-size:${fsL}px;font-weight:700;fill:${color}">${etq}</text>`;
    vals.forEach((x, a) => {
      if (!x) return;
      const niv = conColor && refs[a] ? nivelCoh(x.v, refs[a].v, x.n) : 0, c = niv ? NIVEL_COH[niv].color : 'var(--tinta)';
      s += `<text x="${labelW + a * cellW + cellW / 2}" y="${y + rowH / 2 + 4}" text-anchor="middle" style="font-size:${fsV}px;font-weight:700;fill:${c}">${fmtCoh(x.v)}</text>`;
    });
    return s;
  };
  if (otro) out += filaRef(yP, esc(comp.nombre), COLOR_PAIS[comp.nombre] ?? 'var(--tinta)', propios, true) + filaRef(yP + rowH, 'Chile', COLOR_PAIS.Chile, refs, false);
  else out += filaRef(yP, 'Promedio', 'var(--tinta)', refs, false);
  if (!deals.length) out += `<text x="${ancho / 2}" y="${alto / 2}" text-anchor="middle" style="fill:var(--tinta-3)">Sin deals con estos filtros</text>`;
  return out + '</svg>';
}

// Vista países, "Todos" (27-nov, Beto: "un consolidado entre todos los países, que se entienda simple"): una fila por país, una
// columna por semana, quincena o mes desde su reloj; celda = lo que llegó a la etapa a esa edad, con todas las cohortes desde el
// lanzamiento juntas. Chile arriba (gris: es la referencia); cada país contra Chile a la misma edad. A la derecha, "vs Chile".
function svgCohResumen(ancho0, alto, series, h, per, u) {
  const arr = porArr(), mm = esMM();
  const tope = Math.max(1, Math.min(u.max, Math.ceil((Date.now() - per[0].desde) / (u.dias * DIA))));
  const celdaR = (av, a) => { const r = av.en((a + 1) * u.dias); return r.n && r.obs && r.p != null ? r : null; };
  // Valor de cada país a cada edad: en %, todas sus cohortes juntas (Kaplan-Meier); en millones, el promedio por cohorte.
  const filas = series.map((s) => {
    const av = avance(s.deals, h), cs = mm ? per.map((q) => avance(s.deals.filter((d) => enQ(d, q)), h)) : null;
    const vals = Array.from({ length: tope }, (_, a) => {
      const r = celdaR(av, a);
      if (!r) return null;
      if (!mm) return { v: r.p, n: arr ? r.nArr : r.n, r };
      const vs = cs.map((x) => celdaR(x, a)).filter(Boolean).map((x) => x.arrSi / 1e6);
      return vs.length ? { v: vs.reduce((t, x) => t + x, 0) / vs.length, n: vs.length, r } : null;
    });
    return { s, vals };
  });
  let A = 1;
  for (let a = 0; a < tope; a++) if (filas.some((f) => f.vals[a])) A = a + 1;
  const cl = filas[0];
  const labelW = 130, headH = 30, minCell = 40, resW = 92;
  const ancho = Math.max(ancho0, labelW + A * minCell + resW), cellW = (ancho - labelW - resW - 8) / A, xR = labelW + A * cellW + 8;
  const rowH = Math.max(22, Math.min(64, (alto - headH - 10) / Math.max(1, filas.length)));
  let out = `<svg viewBox="0 0 ${ancho} ${alto}" ${ancho > ancho0 ? `style="width:${ancho}px;min-width:${ancho}px"` : ''} role="img" aria-label="Todos los países">`;
  out += `<text x="0" y="${headH - 10}" style="font-size:11px;fill:var(--tinta-3)">${mm ? 'País · ARR (US$ MM)' : 'País · deals'}</text>`;
  for (let a = 0; a < A; a++) out += `<text x="${labelW + a * cellW + cellW / 2}" y="${headH - 10}" text-anchor="middle" style="font-size:11px;fill:var(--tinta-3)">${a === 0 ? `${u.uno} 1` : a + 1}</text>`;
  out += `<text x="${xR + resW / 2}" y="${headH - 10}" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--tinta-2)">vs Chile</text>`;
  filas.forEach(({ s, vals }, i) => {
    const y = headH + i * rowH + (i ? 6 : 0), difs = [];
    if (i === 1) out += `<line x1="0" x2="${xR - 8}" y1="${y - 4}" y2="${y - 4}" stroke="var(--borde)"/>`;
    out += `<text x="0" y="${y + rowH / 2 + 4}" style="font-size:${Math.min(14, rowH * 0.42)}px;font-weight:700;fill:${s.color}">${esc(s.t)} <tspan style="font-weight:400;font-size:11px;fill:var(--tinta-3)">${mm ? fmtMM(suma(s.deals) / 1e6) : s.deals.length}</tspan></text>`;
    for (let a = 0; a < A; a++) {
      const x = vals[a];
      if (!x) continue;
      const ref = s.otro ? cl.vals[a]?.v ?? null : null, niv = s.otro ? nivelCoh(x.v, ref, x.n) : null;
      const edad = `${a + 1} ${a ? u.t : u.uno}`, tenue = provisional(x.r) || x.n < N_MIN_CELDA;
      if (ref != null && !tenue) difs.push({ d: x.v - ref, niv });
      const tip = `<b>${esc(s.t)} · ${edad} ${desdeQue(h)}</b><br>Llegó a ${h.t}: ${lineaMedida(x.r)}${mm ? ' (promedio por cohorte)' : ''}${ref != null ? `<br>Chile a esta edad: ${fmtCoh(ref)} → <b>${difCoh(x.v - ref)}</b>` : s.otro ? '' : '<br>Es la referencia de los demás países'}${textoNivel(niv)}${x.r.pend ? `<br>${x.r.pend} aún no cumple${x.r.pend > 1 ? 'n' : ''} esa edad: puede subir` : ''}${s.otro ? '' : '<small>Doble clic para ver los que llegaron</small>'}`;
      out += celdaCoh(labelW + a * cellW, y, cellW, rowH, x.v, niv, tenue, tip, s.otro ? [] : [`Chile · llegaron a ${h.t} en ${edad}`, `${x.r.num} de ${x.r.n} deals`, x.r.si]);
    }
    if (difs.length) {
      const d = difs.reduce((t, x) => t + x.d, 0) / difs.length, m = difs.reduce((t, x) => t + x.niv, 0) / difs.length;
      const niv = m >= 1.5 ? 2 : m >= 0.5 ? 1 : m > -0.5 ? 0 : m > -1.5 ? -1 : -2, c = NIVEL_COH[niv];
      out += `<text x="${xR + resW / 2}" y="${y + rowH / 2 + 5}" text-anchor="middle" style="font-size:${Math.min(14, rowH * 0.45)}px;font-weight:800;fill:${niv === 0 ? 'var(--tinta-3)' : c.color}" ${dato(`<b>${esc(s.t)} contra Chile</b><br>En promedio ${difCoh(d)} en ${difs.length} ${difs.length > 1 ? 'columnas' : 'columna'} firme${difs.length > 1 ? 's' : ''}<br><b>${c.t}</b>`)}>${niv > 0 ? '▲' : niv < 0 ? '▼' : '='} ${difCoh(d)}</text>`;
    }
  });
  return out + '</svg>';
}

// ---------- 10. Mapa de Chile navegable (21-nov): zoom con la rueda o botones, arrastre, minimapa y panel "en pantalla" ----------
// Cada deal va en la dirección real de su institución (lib/ubicaciones.js, investigada el 20-nov).
let geoChile = null, geoStgo = null, geoW = null;
const COS = Math.cos((35 * Math.PI) / 180);
const wx = (lon) => lon * COS, wy = (lat) => -lat; // coordenadas "mundo": norte arriba
async function cargarGeo() {
  geoChile ??= await fetch('/chile-regiones.json').then((r) => r.json());
  geoStgo ??= await fetch('/santiago-comunas.json').then((r) => r.json());
  if (geoW) return;
  const caminos = (geo) => Object.fromEntries(Object.entries(geo).map(([n, rings]) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const d = rings.map((r) => 'M' + r.map(([lo, la]) => { const x = wx(lo), y = wy(la); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); return `${x.toFixed(4)},${y.toFixed(4)}`; }).join('L') + 'Z').join('');
    return [n, { d, caja: [x0, y0, x1, y1] }];
  }));
  geoW = { regiones: caminos(geoChile), comunas: caminos(geoStgo) };
}
const ZONAS = {
  chile: ['Chile', -17.3, -56, -76, -66.4], norte: ['Norte', -17.3, -29.6, -71.9, -66.9], centro: ['Centro', -29.3, -38.6, -73.9, -69.8],
  santiago: ['Santiago', -33.30, -33.66, -70.86, -70.45], sur: ['Sur', -37.5, -55.9, -76, -66.4],
};
const cajaZona = ([, la0, la1, lo0, lo1]) => [wx(lo0), wy(la0), wx(lo1), wy(la1)];
let vistaMapa = null, regionSel = null, anim = null;
const ajustar = ([x0, y0, x1, y1], W, H, pad = 0.9) => ({ x: (x0 + x1) / 2, y: (y0 + y1) / 2, k: Math.min(W / Math.max(1e-6, x1 - x0), H / Math.max(1e-6, y1 - y0)) * pad });

const COLOR_OWNER = { Tomi: '#2F6FD6', Anto: '#C6403A', Beto: '#E3A21A' };
const COLOR_ETAPA_MAPA = ['#C9D6C4', '#9FB79A', '#6F9A6A', '#3F7A4A', '#1E5A35', '#0B2E1C'];
function colorDeal(d) {
  const modo = op['mapa.color'];

  if (modo === 'origen') return d.tgp ? '#B08D2E' : '#055A35';
  if (modo === 'etapa') return d.perdido ? '#8A8A8A' : COLOR_ETAPA_MAPA[Math.max(0, columnaDe(d.etapa))];
  if (d.perdido) return '#8A8A8A';
  return { sube: '#1E9E5A', estancado: '#D9473F', espera: '#E3A21A', normal: '#8AA285', firmado: '#055A35' }[estadoDeal(d)];
}
function leyendaMapa() {

  if (modo === 'origen') return leyenda([['#055A35', 'Equipo y otras fuentes'], ['#B08D2E', 'TGP']]);
  if (modo === 'etapa') return leyenda(COLUMNAS.map((c, i) => [COLOR_ETAPA_MAPA[i], c.t]));
  return leyenda([['#1E9E5A', 'Avanzó en 14 días'], ['#D9473F', 'Estancado'], ['#E3A21A', 'En espera o por atender'], ['#8AA285', 'Al día'], ['#055A35', 'Firmado'], ['#8A8A8A', 'Perdido']]);
}
// Métricas con que se pintan las regiones.
const METRICAS_MAPA = {
  arr: { t: 'ARR', v: (ys) => suma(ys), f: (v) => usd(v) },
  n: { t: 'Deals', v: (ys) => ys.length, f: (v) => `${v} deals` },
  tgp: { t: '% TGP', v: (ys) => (ys.length ? ys.filter((d) => d.tgp).length / ys.length : null), f: (v) => `${Math.round(v * 100)}% TGP` },
  pub: { t: '% público', v: (ys) => (ys.length ? ys.filter((d) => d.sector === 'Público').length / ys.length : null), f: (v) => `${Math.round(v * 100)}% público` },
  avanz: { t: 'Avanzados', v: (ys) => suma(ys.filter((d) => d.abierto && ord(d.etapa) >= ord('Negotiation'))), f: (v) => `${usd(v)} de Negotiation en adelante` },

function diapoMapa() {

  const xs = D().filter((d) => (cuales === 'abiertos' ? d.abierto : cuales === 'firmados' ? d.firmado : cuales === 'perdidos' ? d.perdido : true));
