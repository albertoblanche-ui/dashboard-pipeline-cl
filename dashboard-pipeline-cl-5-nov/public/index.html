  listas.clear(); nLista = 0;
  actual = ((actual % DIAPOS.length) + DIAPOS.length) % DIAPOS.length;
  const idx = esMovil() ? DIAPOS.map((_, i) => i) : [actual];
  const hechas = idx.map((i) => ({ i, ...DIAPOS[i].f() }));
  $('#diapos').innerHTML = hechas.map((h) => h.html).join('');
  [...$('#diapos').children].forEach((el, j) => {
    el.classList.add('activa');
    // Si alguna opción de la diapositiva no está en su valor por defecto, aparece "Ver todo" para volver.
    el.querySelectorAll('.card > header .ops, .coh-ops').forEach((o) => {
      const cambiadas = [...new Set([...o.querySelectorAll('[data-op]')].map((b) => b.dataset.op))].filter(marcaOp);
      if (cambiadas.length) o.insertAdjacentHTML('afterbegin', `<button class="btn reset" data-reset="${cambiadas.join(',')}" title="Volver a la vista por defecto">↺ Ver todo</button>`);
    });
    hechas[j].pintar?.(el);
  });
  // Todas las diapositivas con su nombre corto: se ve dónde estás y dónde están las demás (pedido de Beto, 21-nov).
  $('#puntos').innerHTML = DIAPOS.map((d, i) => `<button data-ir="${i}" class="${i === actual ? 'on' : ''}" title="${i + 1}. ${d.t}" aria-current="${i === actual}"><span class="n">${i + 1}</span><span class="c">${d.c}</span></button>`).join('');
  history.replaceState(null, '', location.pathname + location.search + '#' + (actual + 1));
  if ($('#pend').classList.contains('abierto')) pintarPendientes();
  programar();
}
function ir(i) { actual = i; ocultarTip(); pintar(); }
function programar() {
  clearTimeout(rotacion);
  const barra = $('#progreso');
  barra.style.transition = 'none'; barra.style.width = '0';
  $('#auto').setAttribute('aria-pressed', auto);
  $('#auto').textContent = auto ? '⏸ Avanzar solo' : '▶ Avanzar solo';
  if (!auto || esMovil() || $('#pend').classList.contains('abierto')) return;
  requestAnimationFrame(() => requestAnimationFrame(() => { barra.style.transition = `width ${ROTACION_MS}ms linear`; barra.style.width = '100%'; }));
  rotacion = setTimeout(() => ir(actual + 1), ROTACION_MS);
}

// =====================================================================
// Pendientes del equipo (desplegable)
// =====================================================================
const TABS = [['resumen', 'Resumen'], ['toca', 'Le toca'], ['tareas', 'Tareas en Attio'], ['cliente', 'Esperando al cliente'], ['presionar', 'Dónde presionar'], ['higiene', 'Higiene de Attio']];
const personas = () => datos.personas.filter((p) => filtro.owner === 'Todos' || p.corto === filtro.owner);
const dealPasa = (x) => pasa({ ...x, owner: filtro.owner === 'Todos' ? x.owner : filtro.owner });
function diasVencido(iso) { return iso ? Math.floor((Date.now() - new Date(iso + 'T23:59:59')) / DIA) + 1 : null; }
function itemsPersona(p) {
  return [
    ...p.nosToca.filter(dealPasa).map((x) => ({ t: x.cuenta, id: x.id, dias: x.vencido ? diasVencido(x.fechaNextStep) : 0, sinFecha: !x.fechaNextStep })),
    ...p.tareas.filter((t) => !t.deal || dealPasa(datos.deals.find((d) => d.id === t.deal.id) ?? {})).map((t) => ({ t: t.deal?.cuenta ?? t.texto, id: t.deal?.id, dias: t.vencida ? diasVencido(t.vence) : 0, sinFecha: !t.vence })),
  ].sort((a, b) => b.dias - a.dias || a.sinFecha - b.sinFecha);
}
const nivel = (x) => (x.dias > 30 ? 'v3' : x.dias > 7 ? 'v2' : x.dias > 0 ? 'v1' : 'ok');
const cabPersona = (p, sub) => `<div class="cabp">${p.avatar ? `<img src="${p.avatar}" alt="">` : `<span class="ini">${esc(p.corto[0])}</span>`}<div><h3>${esc(p.corto)}</h3><small>${sub}</small></div></div>`;
function itemDeal(x) {
  const e = estadoNextStep(x);
  return `<li data-deal="${x.id}"><span class="lin"><b>${esc(x.cuenta)}</b><span class="fecha ${e.clase === 'critico' ? 'critico' : e.clase === 'serio' ? 'hoy' : ''}">${esc(e.texto)}</span></span><span class="txt">${esc(x.nextStep ?? '')}</span></li>`;
}
function pintarPendientes() {
  const tab = op['pend.tab'];
  $('#pend-sub').textContent = hayFiltro() ? `con los filtros: ${textoFiltro()}` : 'next steps donde la pelota es nuestra, tareas de Attio y lo que espera al cliente';
  $('#pend-tabs').innerHTML = ops('pend.tab', TABS);
  let h = '';
  if (tab === 'resumen') {
    h = `<div class="personas">${personas().map((p) => {
      const items = itemsPersona(p);
      const venc = items.filter((x) => x.dias > 0).length;
      const cuenta = (n) => items.filter((x) => nivel(x) === n).length;
      const tramos = [['ok', 'var(--olivo-500)'], ['v1', 'var(--espera)'], ['v2', 'var(--estancado)'], ['v3', '#8E2A24']];
      return `<div class="per">${cabPersona(p, `${p.esperandoCliente.filter(dealPasa).length} esperando al cliente`)}
        <div class="nums"><div><b>${items.length}</b>pendientes</div><div class="${venc ? 'rojo' : ''}"><b>${venc}</b>vencidos</div></div>
        <div class="barra">${items.length ? tramos.map(([n, c]) => `<span style="width:${(cuenta(n) / items.length) * 100}%;background:${c}"></span>`).join('') : ''}</div>
        <ul>${items.map((x) => `<li class="${nivel(x)}" ${x.id ? `data-deal="${x.id}"` : ''}><span class="lin"><b>${esc(x.t)}</b><span class="fecha ${x.dias > 0 ? 'critico' : ''}">${x.dias > 0 ? `${x.dias} d vencido` : x.sinFecha ? 'sin fecha' : 'al día'}</span></span></li>`).join('') || '<li><span>Nada pendiente</span></li>'}</ul></div>`;
    }).join('')}</div>`;
  } else if (tab === 'toca') {
    h = `<div class="personas">${personas().map((p) => { const xs = p.nosToca.filter(dealPasa); return `<div class="per">${cabPersona(p, `${xs.length} le tocan`)}<ul>${xs.map(itemDeal).join('') || '<li>Nada pendiente</li>'}</ul></div>`; }).join('')}</div>`;
  } else if (tab === 'tareas') {
    const tareasDe = (p) => p.tareas.filter((t) => !t.deal || dealPasa(datos.deals.find((d) => d.id === t.deal.id) ?? {}));
    h = `<div class="personas">${personas().map((p) => `<div class="per">${cabPersona(p, `${tareasDe(p).length} tareas`)}<ul>${tareasDe(p).map((t) => `<li ${t.deal ? `data-deal="${t.deal.id}"` : ''}><span class="lin"><b>${esc(t.deal?.cuenta ?? 'Tarea')}</b><span class="fecha ${t.vencida ? 'critico' : ''}">${t.vence ? fecha(t.vence) : 'Sin fecha'}</span></span><span class="txt">${esc(t.texto)}</span></li>`).join('') || '<li>Sin tareas</li>'}</ul></div>`).join('')}</div>`;
  } else if (tab === 'cliente') {
    h = `<div class="personas">${personas().map((p) => { const xs = p.esperandoCliente.filter(dealPasa); return `<div class="per">${cabPersona(p, `${xs.length} esperando`)}<ul>${xs.map((x) => `<li data-deal="${x.id}"><span class="lin"><b>${esc(x.cuenta)}</b><span class="fecha">${x.diasInactivo} d sin noticias</span></span><span class="txt">${esc(x.nextStep ?? '')}</span></li>`).join('') || '<li>Nada</li>'}</ul></div>`; }).join('')}</div>`;
  } else if (tab === 'presionar') {
    const xs = datos.cola.filter((d) => pasa(d)).slice(0, 20);
    h = `<p class="nota" style="margin-top:0">Los 20 primeros: la etapa más avanzada primero y después el ARR más grande.</p><table class="t"><thead><tr><th>Deal</th><th>Etapa</th><th class="num">ARR</th><th>Owner</th><th>Next step</th></tr></thead><tbody>${xs.map((d) => { const e = estadoNextStep(d); return `<tr data-deal="${d.id}" style="cursor:pointer"><td><b>${esc(d.cuenta)}</b></td><td>${esc(etapaCorta(d.etapa))}</td><td class="num">${usd(d.arrUsd)}</td><td>${esc(d.owner ?? '—')}</td><td><span class="fecha ${e.clase === 'critico' ? 'critico' : ''}">${esc(e.texto)}</span>${d.pelota === 'Cliente' ? ' <small>· esperando al cliente</small>' : ''}<br><small>${esc((d.nextStep ?? '').slice(0, 120))}</small></td></tr>`; }).join('')}</tbody></table>`;
  } else {
    const xs = datos.higiene.filter((d) => pasa(d));
    h = `<p class="nota" style="margin-top:0">Deals abiertos a los que les falta algo en Attio (${xs.length}).</p><table class="t"><thead><tr><th>Deal</th><th>Responsable</th><th class="num">ARR</th><th>Qué falta</th></tr></thead><tbody>${xs.map((d) => `<tr data-deal="${d.id}" style="cursor:pointer"><td><b>${esc(d.cuenta)}</b></td><td>${esc(d.responsable ?? '—')}</td><td class="num">${usd(d.arrUsd)}</td><td style="color:var(--estancado)">${d.problemas.map(esc).join(' · ')}</td></tr>`).join('')}</tbody></table>`;
  }
  $('#pend-cuerpo').innerHTML = h;
}
function abrirPendientes(si = !$('#pend').classList.contains('abierto')) {
  $('#pend').classList.toggle('abierto', si);
  $('#pend').setAttribute('aria-hidden', !si);
  $('#abrir-pend').textContent = si ? 'Pendientes del equipo ▾' : 'Pendientes del equipo ▴';
  if (si) pintarPendientes();
  programar();
}

// =====================================================================
// Detalle, listas, eventos
// =====================================================================
function abrirLista(titulo, sub, xs) {
  const grupos = {};
  for (const d of xs) (grupos[d.tgp ? 'TGP' : d.fuente] ??= []).push(d);
  const orden = Object.keys(grupos).sort((a, b) => (b === 'TGP') - (a === 'TGP') || grupos[b].length - grupos[a].length);
  $('#detalle').innerHTML = `<div class="det lista">
    <div class="cabd"><div><h3>${esc(titulo)}</h3><span style="color:var(--tinta-3)">${esc(sub)}</span></div><button class="cerrar" aria-label="Cerrar">×</button></div>
    <div><b>${xs.length}</b> deals · ARR ${usd(suma(xs))} · TGP: <b>${grupos.TGP?.length ?? 0}</b> (${usd(suma(grupos.TGP ?? []))})</div>
    ${orden.map((f) => `<h4><span>${esc(f)}</span><span>${grupos[f].length} · ${usd(suma(grupos[f]))}</span></h4><ul>${grupos[f].sort((a, b) => b.arrUsd - a.arrUsd).map((d) => `<li data-deal="${d.id}"><span>${esc(d.cuenta)}${d.owner ? ` <small>· ${esc(d.owner)}</small>` : ''}</span><small>${esc(etapaCorta(d.etapa))}</small><b>${usd(d.arrUsd)}</b></li>`).join('')}</ul>`).join('') || '<p>Sin deals.</p>'}
  </div>`;
  if (!$('#detalle').open) $('#detalle').showModal();
}
function abrirDetalle(id) {
  const d = datos.deals.find((x) => x.id === id);
  if (!d) return;
  const e = estadoNextStep(d);
  $('#detalle').innerHTML = `<div class="det">
    <div class="cabd"><div><h3>${esc(d.cuenta)}</h3><span style="color:var(--tinta-3)">${esc(d.nombre)}</span></div><button class="cerrar" aria-label="Cerrar">×</button></div>
    <div class="datos">
      <div>ARR<b>${d.arrEstimado ? '≈' : ''}${usd(d.arrUsd)}</b></div>
      <div>Etapa<b>${esc(etapaCorta(d.etapa))}</b></div>
      <div>Días en la etapa<b>${d.diasEtapa}${d.limiteEtapa ? ` / ${d.limiteEtapa}` : ''}</b></div>
      <div>Owner<b>${esc(d.owner ?? '—')}</b></div>
      <div>Responsable next step<b>${esc(d.responsable ?? '—')}</b></div>
      <div>Sin actividad<b>${d.diasInactivo} días</b></div>
      <div>Firma esperada<b>${d.firmaEsperada ? fecha(d.firmaEsperada) : '—'}</b></div>
      <div>Origen<b>${d.tgp ? 'TGP' : esc(d.fuente)}</b></div>
      <div>Sector<b>${esc(d.sector)}</b></div>
    </div>
    <div class="ns">${esc(textoEstado(d))}</div>
    <div><b>Next step</b> <span class="fecha ${e.clase === 'critico' ? 'critico' : ''}">${esc(e.texto)}</span><div class="ns" style="margin-top:6px;background:var(--tarjeta-2)">${esc(d.nextStep ?? 'Sin next step')}</div></div>
    ${d.problemas.length ? `<div><b>Para resolver en Attio</b><ul>${d.problemas.map((p) => `<li>${esc(p)}</li>`).join('')}</ul></div>` : ''}
    ${d.movimientos.length ? `<div><b>Movimiento esta semana</b><ul>${d.movimientos.map((m) => `<li>${esc(m.de)} → ${esc(m.a)} · ${fecha(m.fecha)}${m.por ? ' · ' + esc(m.por) : ''}</li>`).join('')}</ul></div>` : ''}
    <a class="boton" href="${d.url}" target="_blank" rel="noopener">Abrir en Attio</a>
  </div>`;
  if (!$('#detalle').open) $('#detalle').showModal();
}
const abrirListaDe = (k) => { const l = listas.get(k); if (l) abrirLista(l.titulo, l.sub, l.ids.map((id) => datos.deals.find((d) => d.id === id)).filter(Boolean)); };

// Tooltip: cualquier elemento con data-tip.
const tip = $('#tip');
function ocultarTip() { tip.classList.remove('on'); }
document.addEventListener('mouseover', (e) => {
  const el = e.target.closest?.('[data-tip]');
  if (!el) return ocultarTip();
  tip.innerHTML = el.getAttribute('data-tip');
  tip.classList.add('on');
});
document.addEventListener('mousemove', (e) => {
  if (!tip.classList.contains('on')) return;
  const r = tip.getBoundingClientRect();
  const cx = (e.clientX - OFF_X) / Z, cy = (e.clientY - OFF_Y) / Z, rw = r.width / Z, rh = r.height / Z;
  let x = cx + 16, y = cy + 16;
  if (x + rw > (MODO_TV ? BASE_W : innerWidth) - 8) x = cx - rw - 16;
  if (y + rh > (MODO_TV ? BASE_H : innerHeight) - 8) y = cy - rh - 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
document.addEventListener('mouseleave', ocultarTip);

document.addEventListener('click', (e) => {
  if (e.target.closest('.cerrar') && e.target.closest('dialog')) return $('#detalle').close();
  if (e.target.id === 'detalle') return $('#detalle').close();
  const f = e.target.closest('[data-filtro]');
  if (f) { filtro[f.dataset.filtro] = f.dataset.v; guardar('vu-filtro', filtro); return pintar(); }
  if (e.target.closest('[data-limpiar]')) { Object.assign(filtro, { owner: 'Todos', origen: 'Todos', sector: 'Todos' }); guardar('vu-filtro', filtro); return pintar(); }
  const rs = e.target.closest('[data-reset]');
  if (rs) { for (const k of rs.dataset.reset.split(',')) op[k] = DEF_OP[k]; guardar('vu-op2', op); return pintar(); }
  const o = e.target.closest('[data-op]');
  if (o) { op[o.dataset.op] = o.dataset.v; guardar('vu-op2', op); return o.dataset.op.startsWith('pend.') ? pintarPendientes() : pintar(); }
  const rg = e.target.closest('[data-region]');
  if (rg) { regionSel = rg.dataset.region; document.querySelectorAll('tr[data-region]').forEach((t) => t.classList.toggle('sel', t.dataset.region === regionSel)); return irARegionMapa(regionSel); }
  const irA = e.target.closest('[data-ir]');
  if (irA) return ir(Number(irA.dataset.ir));
  const deal = e.target.closest('[data-deal]');
  if (deal) { ocultarTip(); return abrirDetalle(deal.dataset.deal); }
  const cl = e.target.closest('[data-clic][data-lista]');
  if (cl) { ocultarTip(); return abrirListaDe(cl.dataset.lista); }
});
document.addEventListener('dblclick', (e) => {
  const el = e.target.closest('[data-lista]');
  if (el && !el.closest('[data-deal]')) { ocultarTip(); getSelection()?.removeAllRanges(); abrirListaDe(el.dataset.lista); }
});
document.addEventListener('keydown', (e) => {
  if ($('#detalle').open) return;
  if (e.key === 'Escape' && $('#pend').classList.contains('abierto')) return abrirPendientes(false);
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === 'ArrowRight') ir(actual + 1);
  if (e.key === 'ArrowLeft') ir(actual - 1);
});
$('#ant').onclick = () => ir(actual - 1);
$('#sig').onclick = () => ir(actual + 1);
$('#auto').onclick = () => { auto = !auto; programar(); };
$('#abrir-pend').onclick = () => abrirPendientes();
$('#cerrar-pend').onclick = () => abrirPendientes(false);
$('#completa').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {}));

// ---------- Celebración cuando aparece un deal firmado nuevo ----------
function revisarFirmas() {
  const ids = datos.meta.firmados.map((f) => f.id);
  let vistos = null;
  try { vistos = JSON.parse(localStorage.getItem('tv-firmados') ?? 'null'); } catch {}
  try { localStorage.setItem('tv-firmados', JSON.stringify(ids)); } catch {}
  const nuevo = vistos ? datos.meta.firmados.find((f) => !vistos.includes(f.id)) : null;
  if (nuevo) celebrar(nuevo);
}
function celebrar(f) {
  $('#fiesta-cuenta').textContent = f.cuenta;
  $('#fiesta-monto').textContent = usd(f.arrUsd) + ' de ARR';
  const caja = $('#fiesta');
  caja.classList.add('on');
  const c = caja.querySelector('canvas');
  const ctx = c.getContext('2d');
  c.width = MODO_TV ? BASE_W : innerWidth; c.height = MODO_TV ? BASE_H : innerHeight;
  const colores = ['#F6F5EB', '#9FA782', '#CEEADC', '#BCCCB7', '#FCFCFC'];
  const piezas = Array.from({ length: 260 }, () => ({ x: Math.random() * c.width, y: -Math.random() * c.height, v: 2 + Math.random() * 5, r: Math.random() * Math.PI, w: 6 + Math.random() * 10, col: colores[Math.floor(Math.random() * colores.length)] }));
  const fin = Date.now() + 60_000;
  (function cuadro() {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const p of piezas) {
      p.y += p.v; p.r += 0.08; p.x += Math.sin(p.r) * 1.5;
      if (p.y > c.height) p.y = -20;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); ctx.restore();
    }
    if (Date.now() < fin && caja.classList.contains('on')) requestAnimationFrame(cuadro); else caja.classList.remove('on');
  })();
}
$('#fiesta').onclick = () => $('#fiesta').classList.remove('on');

// ---------- Carga ----------
async function cargar(refrescar = false) {
  try {
    datos = await cargarDatos({ refrescar });
    ordenEtapa = Object.fromEntries(datos.etapas.map((e, i) => [e.nombre, i]));
    $('#error').style.display = 'none';
    $('#actualizado').textContent = `Attio · ${hora(datos.actualizado)}`;
    pintar();
    revisarFirmas();
  } catch (e) {
    $('#error').style.display = 'block';
    $('#error').textContent = 'No se pudo leer Attio: ' + e.message;
  }
}
$('#refrescar').onclick = () => cargar(true);
let tamano;
addEventListener('resize', () => { clearTimeout(tamano); tamano = setTimeout(() => { escalar(); pintar(); }, 200); });
addEventListener('hashchange', () => { const n = Number(location.hash.slice(1)) - 1; if (n >= 0 && n !== actual && n < DIAPOS.length) ir(n); });
setInterval(() => cargar(), 5 * 60 * 1000);
await cargar();
if (params.has('celebrar') && datos) celebrar(datos.meta.firmados[0] ?? { cuenta: 'Prueba', arrUsd: 0 });
</script>
