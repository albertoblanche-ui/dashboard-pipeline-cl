<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Chile TV</title>
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { font-size: clamp(14px, 1.15vw, 22px); }
  .tv { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 2.2vw 3vw 1.4vw; gap: 1.6vw; }
  .arriba { display: flex; justify-content: space-between; align-items: baseline; }
  .arriba h1 { font-size: 1.6em; }
  .reloj { font-size: 1.6em; font-weight: 600; color: var(--tinta-2); }
  .pantalla { display: none; min-height: 0; }
  #pantallas { min-height: 0; }
  .pantalla.activa { display: grid; height: 100%; animation: entrar .6s ease; }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .abajo { display: flex; justify-content: space-between; align-items: center; color: var(--tinta-3); font-size: .85em; }
  .puntos { display: flex; gap: 8px; }
  .puntos span { width: 10px; height: 10px; border-radius: 50%; background: var(--borde); }
  .puntos span.on { background: var(--tinta-2); }

  /* A · Meta */
  .meta { grid-template-columns: 1.4fr 1fr; gap: 3vw; align-content: center; }
  .grande .etq { font-size: 1.3em; color: var(--tinta-2); }
  .grande .num { font-size: 7.5em; font-weight: 700; letter-spacing: -0.04em; line-height: 1; margin: .1em 0 .25em; }
  .grande .barra { height: 2.2vw; }
  .grande .pct { display: flex; justify-content: space-between; margin-top: .6em; font-size: 1.4em; color: var(--tinta-2); }
  .grande .pct strong { color: var(--tinta); }
  .tiles { display: grid; gap: 1.2vw; align-content: center; }
  .tile { background: var(--superficie); border: 1px solid var(--borde); border-radius: 14px; padding: 1.2vw 1.6vw; }
  .tile .etq { color: var(--tinta-2); font-size: 1em; }
  .tile .num { font-size: 2.8em; font-weight: 650; letter-spacing: -0.02em; }
  .tile .sub { color: var(--tinta-3); font-size: .9em; }

  /* B · Camino */
  .camino { grid-template-columns: 1.3fr 1fr; gap: 3vw; min-height: 0; }
  h2.sec { font-size: 1.3em; margin-bottom: .8em; color: var(--tinta-2); font-weight: 600; }
  .mws { display: grid; gap: 1vw; }
  .mw { background: var(--superficie); border: 1px solid var(--borde); border-radius: 14px; padding: 1vw 1.4vw; display: grid; gap: .4em; }
  .mw.firmado { border-color: var(--bien); }
  .mw .top { display: flex; justify-content: space-between; gap: 1em; align-items: baseline; }
  .mw .nombre { font-size: 1.5em; font-weight: 650; }
  .mw .monto { font-size: 1.5em; font-weight: 650; }
  .mw .ns { color: var(--tinta-2); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .chip { font-size: .85em; padding: .1em .7em; }
  .fun { display: grid; gap: .9vw; }
  .fn { display: grid; grid-template-columns: 9em 1fr 7.5em; gap: 1em; align-items: center; font-size: 1.05em; }
  .fn .barra { height: 1.8vw; border-radius: 6px; }
  .fn .barra > span { border-radius: 0 6px 6px 0; }
  .fn .n { text-align: right; }

  /* C · Lo que nos toca */
  .toca { grid-template-columns: repeat(4, 1fr); gap: 1.4vw; min-height: 0; }
  .col { background: var(--superficie); border: 1px solid var(--borde); border-radius: 14px; padding: 1.2vw; display: grid; grid-template-rows: auto 1fr; gap: 1vw; min-height: 0; overflow: hidden; }
  .col .cab { display: flex; align-items: center; gap: .7em; }
  .col img, .col .avatar { width: 2.6em; height: 2.6em; border-radius: 50%; background: var(--superficie-2); display: grid; place-items: center; font-weight: 700; }
  .col h3 { font-size: 1.4em; }
  .col .venc { color: var(--critico-texto); font-weight: 650; }
  .col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .8em; align-content: start; }
  .col li { display: grid; gap: .2em; }
  .col li .cuenta { font-weight: 600; font-size: 1.05em; }
  .col li .txt { color: var(--tinta-2); font-size: .85em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* Celebración */
  #fiesta { position: fixed; inset: 0; display: none; place-items: center; z-index: 10; background: rgba(13,13,13,.86); }
  #fiesta.on { display: grid; }
  #fiesta canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #fiesta .msg { position: relative; text-align: center; animation: latido 1.2s ease-in-out infinite; }
  #fiesta .msg .t1 { font-size: 3em; color: var(--tinta-2); }
  #fiesta .msg .t2 { font-size: 8em; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  #fiesta .msg .t3 { font-size: 3.4em; font-weight: 700; color: var(--bien); }
  @keyframes latido { 50% { transform: scale(1.04); } }
  #error { position: fixed; bottom: 1vw; right: 1vw; background: var(--superficie); border: 1px solid var(--critico); padding: .6em 1em; border-radius: 8px; display: none; }
  .cargando { display: grid; place-items: center; font-size: 1.6em; color: var(--tinta-2); }
</style>
</head>
<body>
<div class="tv">
  <div class="arriba"><h1>Pipeline Chile · Camino al millón</h1><span class="reloj" id="reloj"></span></div>
  <div id="pantallas" class="cargando">Leyendo Attio…</div>
  <div class="abajo"><span id="actualizado"></span><div class="puntos" id="puntos"></div><span>Vidas salvadas: pendiente (Critical Saving Alerts)</span></div>
</div>
<div id="fiesta"><canvas></canvas><div class="msg"><div class="t1">¡Firmamos!</div><div class="t2" id="fiesta-cuenta"></div><div class="t3" id="fiesta-monto"></div></div></div>
<div id="error"></div>

<script type="module">
import { cargarDatos, usd, fecha, hora, esc, etapaCorta, estadoNextStep } from '/common.js';

const ROTACION_MS = 30_000;
const $ = (s) => document.querySelector(s);
let datos = null;
let actual = 0;

function pantallaMeta(d) {
  const m = d.meta;
  return `<section class="pantalla meta">
    <div class="grande">
      <div class="etq">ARR firmado 2026</div>
      <div class="num">${usd(m.arrFirmadoUsd)}</div>
      <div class="barra"><span style="width:${Math.min(100, m.avance * 100)}%"></span></div>
      <div class="pct"><span><strong>${Math.round(m.avance * 100)}%</strong> de ${usd(m.metaUsd)}</span><span>Faltan <strong>${usd(m.faltaUsd)}</strong></span></div>
    </div>
    <div class="tiles">
      <div class="tile"><div class="etq">Días al 31-dic</div><div class="num">${m.diasAlCierre}</div><div class="sub">Hay que firmar ${usd(m.ritmoSemanalUsd)} por semana</div></div>
      <div class="tile"><div class="etq">En vivo (Ready for use)</div><div class="num">${usd(m.arrEnVivoUsd)}</div></div>
      <div class="tile"><div class="etq">Ponderado que firma en 2026</div><div class="num">${usd(m.ponderado2026Usd)}</div><div class="sub">${m.dealsAbiertos} deals abiertos · ${usd(m.pipelineAbiertoUsd)} en pipeline</div></div>
    </div>
  </section>`;
}

function pantallaCamino(d) {
  const max = Math.max(...d.funnel.map((f) => f.arrUsd), 1);
  const mw = d.mustWin.filter((x) => x.abierto).slice(0, 4);
  return `<section class="pantalla camino">
    <div><h2 class="sec">Must-win y firmados</h2><div class="mws">
      ${d.meta.firmados.length ? `<div class="mw firmado"><div class="top"><span class="nombre">Firmados</span><span class="monto">${usd(d.meta.arrFirmadoUsd)}</span></div><div style="display:flex;gap:.5em;flex-wrap:wrap">${d.meta.firmados.map((f) => `<span class="chip bien">${esc(f.cuenta)} · ${usd(f.arrUsd)}</span>`).join('')}</div></div>` : ''}
      ${mw.map((x) => {
        const e = estadoNextStep(x);
        return `<div class="mw"><div class="top"><span class="nombre">★ ${esc(x.cuenta)}</span><span class="monto">${usd(x.arrUsd)}</span></div>
          <div class="tags" style="display:flex;gap:.5em;flex-wrap:wrap"><span class="chip sin-punto">${esc(etapaCorta(x.etapa))} · ${x.diasEtapa} días</span><span class="chip ${e.clase}">${e.texto}</span>${x.estancado ? '<span class="chip serio">Estancado</span>' : ''}<span class="chip sin-punto">${esc(x.responsable ?? 'Sin responsable')}</span></div>
          <div class="ns">${esc(x.nextStep ?? 'Sin next step')}</div></div>`;
      }).join('')}
    </div></div>
    <div><h2 class="sec">Funnel por etapa (ARR · deals)</h2><div class="fun">
      ${d.funnel.map((f) => `<div class="fn"><span>${esc(etapaCorta(f.etapa))}</span><div class="barra"><span style="width:${(f.arrUsd / max) * 100}%"></span></div><span class="n"><strong>${usd(f.arrUsd)}</strong> · ${f.deals}</span></div>`).join('')}
    </div></div>
  </section>`;
}

function pantallaToca(d) {
  return `<section class="pantalla toca">
    ${d.personas.map((p) => {
      const lista = [...p.nosToca].sort((a, b) => (b.vencido - a.vencido) || (b.arrUsd - a.arrUsd)).slice(0, 5);
      return `<div class="col">
        <div class="cab">${p.avatar ? `<img src="${esc(p.avatar)}" alt="">` : `<span class="avatar">${esc(p.corto[0])}</span>`}
          <div><h3>${esc(p.corto)}</h3><span class="${p.vencidos ? 'venc' : 'tenue'}">${p.vencidos} vencidos</span></div></div>
        <ul>${lista.map((x) => {
          const e = estadoNextStep(x);
          return `<li><div style="display:flex;justify-content:space-between;gap:.5em"><span class="cuenta">${esc(x.cuenta)}</span><span class="chip ${e.clase}">${e.texto}</span></div><span class="txt">${esc(x.nextStep)}</span></li>`;
        }).join('') || '<li class="tenue">Al día</li>'}</ul>
      </div>`;
    }).join('')}
  </section>`;
}

function render() {
  $('#pantallas').className = '';
  $('#pantallas').innerHTML = pantallaMeta(datos) + pantallaCamino(datos) + pantallaToca(datos);
  $('#actualizado').textContent = `Attio · actualizado ${hora(datos.actualizado)}`;
  mostrar(actual);
}

function mostrar(i) {
  const ps = document.querySelectorAll('.pantalla');
  if (!ps.length) return;
  actual = i % ps.length;
  ps.forEach((p, j) => p.classList.toggle('activa', j === actual));
  $('#puntos').innerHTML = [...ps].map((_, j) => `<span class="${j === actual ? 'on' : ''}"></span>`).join('');
}

// Celebración: si aparece un deal firmado que esta pantalla no había visto, explota.
function revisarFirmas() {
  const ids = datos.meta.firmados.map((f) => f.id);
  let vistos = null;
  try { vistos = JSON.parse(localStorage.getItem('tv-firmados') ?? 'null'); } catch {}
  try { localStorage.setItem('tv-firmados', JSON.stringify(ids)); } catch {}
  const nuevo = vistos ? datos.meta.firmados.find((f) => !vistos.includes(f.id)) : null;
  if (nuevo) celebrar(nuevo);
}

function celebrar(f) {
  $('#fiesta-cuenta').textContent = f.cuenta;
  $('#fiesta-monto').textContent = usd(f.arrUsd) + ' de ARR';
  const caja = $('#fiesta');
  caja.classList.add('on');
  const c = caja.querySelector('canvas');
  const ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const colores = ['#3987e5', '#0ca30c', '#fab219', '#ec835a', '#e87ba4', '#9085e9'];
  const piezas = Array.from({ length: 260 }, () => ({
    x: Math.random() * c.width, y: -Math.random() * c.height, v: 2 + Math.random() * 5,
    r: Math.random() * Math.PI, w: 6 + Math.random() * 10, col: colores[Math.floor(Math.random() * colores.length)],
  }));
  const fin = Date.now() + 60_000;
  (function cuadro() {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const p of piezas) {
      p.y += p.v; p.r += 0.08; p.x += Math.sin(p.r) * 1.5;
      if (p.y > c.height) p.y = -20;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col;
      ctx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); ctx.restore();
    }
    if (Date.now() < fin) requestAnimationFrame(cuadro);
    else caja.classList.remove('on');
  })();
}

async function cargar() {
  try {
    datos = await cargarDatos();
    $('#error').style.display = 'none';
    render();
    revisarFirmas();
  } catch (e) {
    $('#error').style.display = 'block';
    $('#error').textContent = 'Sin conexión con Attio: ' + e.message;
  }
}

setInterval(() => ($('#reloj').textContent = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' })), 1000);
setInterval(() => mostrar(actual + 1), ROTACION_MS);
setInterval(cargar, 5 * 60 * 1000);
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') mostrar(actual + 1);
  if (e.key === 'ArrowLeft') mostrar(actual + 2);
});
await cargar();
if (new URLSearchParams(location.search).has('celebrar') && datos) celebrar(datos.meta.firmados[0] ?? { cuenta: 'Prueba', arrUsd: 0 });
</script>
</body>
</html>
