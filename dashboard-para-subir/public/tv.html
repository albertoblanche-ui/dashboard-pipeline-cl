<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Chile TV</title>
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #0b0c0e; color: #f8fafc; }
  body { font-size: clamp(14px, 1.15vw, 22px); }
  .tv { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 2vw 3vw 1.5vw; gap: 1.5vw; }
  
  /* Cabecera */
  .arriba { display: flex; justify-content: space-between; align-items: center; }
  .arriba h1 { font-size: 1.6em; font-weight: 700; color: #f8fafc; }
  .arriba-derecha { display: flex; align-items: center; gap: 1.5em; }
  .reloj { font-size: 1.5em; font-weight: 600; color: var(--tinta-2); }
  .volver-btn {
    font-size: 0.85em; text-decoration: none; padding: 6px 14px; border-radius: 8px;
    background: var(--superficie-2); color: var(--tinta-2); border: 1px solid var(--borde);
    transition: all 0.2s;
  }
  .volver-btn:hover { color: #fff; border-color: var(--azul); }

  /* Contenedor de Pantallas */
  #pantallas { min-height: 0; }
  .pantalla { display: none; min-height: 0; height: 100%; animation: entrar .6s ease; }
  .pantalla.activa { display: grid; }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Barra inferior */
  .abajo { display: flex; justify-content: space-between; align-items: center; color: var(--tinta-3); font-size: .85em; }
  .puntos { display: flex; gap: 8px; }
  .puntos span { width: 10px; height: 10px; border-radius: 50%; background: var(--borde); }
  .puntos span.on { background: var(--azul); transform: scale(1.2); }

  /* PANTALLA 1: META LIMPIA */
  .meta-limpia { place-content: center; text-align: center; max-width: 900px; margin: 0 auto; gap: 2vw; }
  .meta-limpia .etq { font-size: 1.8em; color: var(--tinta-2); text-transform: uppercase; letter-spacing: 0.05em; }
  .meta-limpia .num { font-size: 8.5em; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: #fff; margin: .1em 0; }
  .meta-limpia .barra { height: 2.2vw; background: var(--superficie-2); border-radius: 999px; overflow: hidden; }
  .meta-limpia .barra > span { display: block; height: 100%; background: var(--azul); border-radius: 999px; }
  .meta-limpia .pct { display: flex; justify-content: space-between; margin-top: .8em; font-size: 1.6em; color: var(--tinta-2); }
  .meta-limpia .pct strong { color: #fff; }

  /* PANTALLA 2: KANBAN MACRO (CARRERA) */
  .carrera { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1vw; min-height: 0; overflow: hidden; }
  .col-carrera {
    background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px;
    padding: 1vw; display: flex; flex-direction: column; gap: 0.8vw; min-height: 0;
  }
  .col-cab { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--borde); padding-bottom: 0.5vw; }
  .col-cab h3 { font-size: 1.1em; color: var(--tinta-2); margin: 0; }
  .col-cab .monto { font-size: 1.1em; font-weight: 700; color: var(--azul); }
  .deals-lista { display: flex; flex-direction: column; gap: 0.6vw; overflow: hidden; }
  .card-tv {
    background: var(--superficie-2); border: 1px solid var(--borde); border-radius: 8px;
    padding: 0.8vw; display: flex; flex-direction: column; gap: 0.4vw; position: relative;
  }
  .card-tv.movido { border-left: 5px solid var(--bien); }
  .card-tv .top { display: flex; justify-content: space-between; align-items: baseline; }
  .card-tv .nombre { font-size: 1.1em; font-weight: 700; }
  .card-tv .arr { font-size: 1.05em; font-weight: 700; color: var(--azul); }
  .card-tv .sub { display: flex; justify-content: space-between; align-items: center; font-size: 0.8em; color: var(--tinta-3); }

  /* PANTALLA 3: LO QUE NOS TOCA (TEXTO COMPLETO) */
  .toca { grid-template-columns: repeat(4, 1fr); gap: 1.2vw; min-height: 0; }
  .col-toca {
    background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px;
    padding: 1.2vw; display: flex; flex-direction: column; gap: 1vw; min-height: 0; overflow: hidden;
  }
  .col-toca .cab { display: flex; align-items: center; gap: .7em; }
  .col-toca .avatar { width: 2.4em; height: 2.4em; border-radius: 50%; background: var(--superficie-2); display: grid; place-items: center; font-weight: 700; }
  .col-toca h3 { font-size: 1.3em; margin: 0; }
  .col-toca ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1vw; overflow-y: auto; }
  .col-toca li { display: flex; flex-direction: column; gap: 0.3em; background: var(--superficie-2); padding: 0.8vw; border-radius: 8px; }
  .col-toca .cuenta { font-weight: 700; font-size: 1.05em; }
  .col-toca .txt { color: var(--tinta-2); font-size: 0.9em; line-height: 1.4; word-break: break-word; } /* Texto completo sin clamp */

  /* Celebración */
  #fiesta { position: fixed; inset: 0; display: none; place-items: center; z-index: 10; background: rgba(11,12,14,.92); }
  #fiesta.on { display: grid; }
  #fiesta canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #fiesta .msg { position: relative; text-align: center; animation: latido 1.2s ease-in-out infinite; }
  #fiesta .msg .t1 { font-size: 3em; color: var(--tinta-2); }
  #fiesta .msg .t2 { font-size: 7em; font-weight: 800; line-height: 1.05; }
  #fiesta .msg .t3 { font-size: 3em; font-weight: 700; color: var(--bien); }
  @keyframes latido { 50% { transform: scale(1.04); } }
  #error { position: fixed; bottom: 1vw; right: 1vw; background: var(--superficie); border: 1px solid var(--critico); padding: .6em 1em; border-radius: 8px; display: none; }
  .cargando { display: grid; place-items: center; font-size: 1.6em; color: var(--tinta-2); }
</style>
</head>
<body>
<div class="tv">
  <div class="arriba">
    <h1>Pipeline Chile · Camino al millón</h1>
    <div class="arriba-derecha">
      <span class="reloj" id="reloj"></span>
      <a href="/" class="volver-btn">← Torre de control</a>
    </div>
  </div>
  <div id="pantallas" class="cargando">Leyendo Attio…</div>
  <div class="abajo">
    <span id="actualizado"></span>
    <div class="puntos" id="puntos"></div>
  </div>
</div>

<div id="fiesta"><canvas></canvas><div class="msg"><div class="t1">¡Firmamos!</div><div class="t2" id="fiesta-cuenta"></div><div class="t3" id="fiesta-monto"></div></div></div>
<div id="error"></div>

<script type="module">
import { cargarDatos, usd, fecha, hora, esc, etapaCorta, estadoNextStep } from '/common.js';

const ROTACION_MS = 25_000;
const $ = (s) => document.querySelector(s);
let datos = null;
let actual = 0;

// Pantalla 1: Meta limpia sin componentes innecesarios
function pantallaMeta(d) {
  const m = d.meta;
  return `<section class="pantalla meta-limpia">
    <div class="etq">ARR firmado 2026</div>
    <div class="num">${usd(m.arrFirmadoUsd)}</div>
    <div class="barra"><span style="width:${Math.min(100, m.avance * 100)}%"></span></div>
    <div class="pct">
      <span><strong>${Math.round(m.avance * 100)}%</strong> de ${usd(m.metaUsd)}</span>
      <span>Faltan <strong>${usd(m.faltaUsd)}</strong></span>
    </div>
  </section>`;
}

// Pantalla 2: Macro Pipeline (Carrera por etapas)
function pantallaCarrera(d) {
  const etapasVisibles = d.funnel.filter(f => f.etapa !== 'Closed lost' && f.etapa !== 'Churned' && f.etapa !== 'Ready for use 🎉');
  return `<section class="pantalla carrera">
    ${etapasVisibles.map(col => {
      const dealsEtapa = d.deals.filter(x => x.abierto && x.etapa === col.etapa).sort((a,b) => b.arrUsd - a.arrUsd).slice(0, 5);
      return `<div class="col-carrera">
        <div class="col-cab">
          <h3>${esc(etapaCorta(col.etapa))}</h3>
          <span class="monto">${usd(col.arrUsd)}</span>
        </div>
        <div class="deals-lista">
          ${dealsEtapa.map(x => {
            const movido = x.movimientos.length > 0 ? 'movido' : '';
            return `<div class="card-tv ${movido}">
              <div class="top">
                <span class="nombre">${esc(x.cuenta)}</span>
                <span class="arr">${usd(x.arrUsd)}</span>
              </div>
              <div class="sub">
                <span>${esc(x.owner ?? '—')}</span>
                <span>${x.diasEtapa}d</span>
              </div>
            </div>`;
          }).join('') || '<div class="tenue" style="font-size:0.85em; text-align:center; padding:1em;">Sin deals</div>'}
        </div>
      </div>`;
    }).join('')}
  </section>`;
}

// Pantalla 3: Lo que nos toca (con texto completo sin cortes)
function pantallaToca(d) {
  const equipo = ['Tomi', 'Seba', 'Anto', 'Beto'];
  return `<section class="pantalla toca">
    ${equipo.map((p) => {
      const susDeals = d.deals.filter((x) => x.abierto && (x.responsable === p || x.owner === p) && x.pelota !== 'Cliente');
      const susTareas = d.tareas.filter((t) => t.asignados.includes(p));
      const totalItems = [...susDeals.slice(0, 4), ...susTareas.slice(0, 2)];

      return `<div class="col-toca">
        <div class="cab">
          <span class="avatar">${esc(p[0])}</span>
          <div><h3>${esc(p)}</h3></div>
        </div>
        <ul>${totalItems.map((x) => {
          if (x.texto) { // Es tarea
            return `<li><span class="cuenta">Tarea Attio</span><span class="txt">${esc(x.texto)}</span></li>`;
          }
          const e = estadoNextStep(x);
          return `<li>
            <div style="display:flex; justify-content:space-between; align-items:baseline;">
              <span class="cuenta">${esc(x.cuenta)}</span>
              <span class="chip ${e.clase}">${e.texto}</span>
            </div>
            <span class="txt">${esc(x.nextStep || 'Sin next step')}</span>
          </li>`;
        }).join('') || '<li class="tenue">Al día</li>'}</ul>
      </div>`;
    }).join('')}
  </section>`;
}

function render() {
  $('#pantallas').className = '';
  $('#pantallas').innerHTML = pantallaMeta(datos) + pantallaCarrera(datos) + pantallaToca(datos);
  $('#actualizado').textContent = `Attio · actualizado ${hora(datos.actualizado)}`;
  mostrar(actual);
}

function mostrar(i) {
  const ps = document.querySelectorAll('.pantalla');
  if (!ps.length) return;
  actual = i % ps.length;
  ps.forEach((p, j) => p.classList.toggle('activa', j === actual));
  $('#puntos').innerHTML = [...ps].map((_, j) => `<span class="${j === actual ? 'on' : ''}"></span>`).join('');
}

function revisarFirmas() {
  const ids = datos.meta.firmados.map((f) => f.id);
  let vistos = null;
  try { vistos = JSON.parse(localStorage.getItem('tv-firmados') ?? 'null'); } catch {}
  try { localStorage.setItem('tv-firmados', JSON.stringify(ids)); } catch {}
  const nuevo = vistos ? datos.meta.firmados.find((f) => !vistos.includes(f.id)) : null;
  if (nuevo) celebrar(nuevo);
}

function celebrar(f) {
  $('#fiesta-cuenta').textContent = f.cuenta;
  $('#fiesta-monto').textContent = usd(f.arrUsd) + ' de ARR';
  const caja = $('#fiesta');
  caja.classList.add('on');
  const c = caja.querySelector('canvas');
  const ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const colores = ['#4f46e5', '#10b981', '#f59e0b', '#ec835a', '#6366f1'];
  const piezas = Array.from({ length: 260 }, () => ({
    x: Math.random() * c.width, y: -Math.random() * c.height, v: 2 + Math.random() * 5,
    r: Math.random() * Math.PI, w: 6 + Math.random() * 10, col: colores[Math.floor(Math.random() * colores.length)],
  }));
  const fin = Date.now() + 60_000;
  (function cuadro() {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const p of piezas) {
      p.y += p.v; p.r += 0.08; p.x += Math.sin(p.r) * 1.5;
      if (p.y > c.height) p.y = -20;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col;
      ctx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); ctx.restore();
    }
    if (Date.now() < fin) requestAnimationFrame(cuadro);
    else caja.classList.remove('on');
  })();
}

async function cargar() {
  try {
    datos = await cargarDatos();
    $('#error').style.display = 'none';
    render();
    revisarFirmas();
  } catch (e) {
    $('#error').style.display = 'block';
    $('#error').textContent = 'Sin conexión con Attio: ' + e.message;
  }
}

setInterval(() => ($('#reloj').textContent = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' })), 1000);
setInterval(() => mostrar(actual + 1), ROTACION_MS);
setInterval(cargar, 5 * 60 * 1000);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') mostrar(actual + 1);
  if (e.key === 'ArrowLeft') mostrar(actual + 2);
  if (e.key === 'Escape' || e.key === 'Backspace') window.location.href = '/';
});

await cargar();
</script>
</body>
</html>
