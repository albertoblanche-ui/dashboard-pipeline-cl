<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torre de control</title>
<link rel="stylesheet" href="/styles.css">
<style>
  header {
    position: sticky; top: 0; z-index: 5; background: var(--plano);
    border-bottom: 1px solid var(--borde); padding: 12px 24px;
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
  }
  header h1 { font-size: 18px; }
  header .acciones { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, .boton {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--borde); background: var(--superficie); color: var(--tinta); text-decoration: none;
  }
  button[aria-pressed='true'] { background: var(--tinta); color: var(--plano); border-color: var(--tinta); }
  main { padding: 20px 24px 48px; max-width: 1440px; margin: 0 auto; display: grid; gap: 20px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .kpi, .panel { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); }
  .kpi { padding: 14px 16px; display: grid; gap: 4px; }
  .kpi .etq { font-size: 12px; color: var(--tinta-2); }
  .kpi .num { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .kpi .sub { font-size: 12px; color: var(--tinta-3); }
  .panel { padding: 16px; min-width: 0; }
  .panel > h2 { font-size: 15px; margin-bottom: 4px; }
  .panel > .pregunta { font-size: 12px; color: var(--tinta-3); margin: 0 0 12px; }
  .dos { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  .mitades { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 1000px) { .dos, .mitades { grid-template-columns: 1fr; } }

  .fila {
    display: grid; grid-template-columns: 28px minmax(150px, 1.2fr) 130px 96px minmax(200px, 2.4fr) 150px;
    gap: 12px; padding: 10px 4px; border-top: 1px solid var(--borde); align-items: start;
  }
  .fila.cabecera { border-top: 0; font-size: 11px; color: var(--tinta-3); text-transform: uppercase; letter-spacing: .04em; padding-top: 0; }
  .rank { color: var(--tinta-3); font-weight: 600; }
  .cuenta a { font-weight: 600; text-decoration: none; }
  .cuenta a:hover { text-decoration: underline; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .ns { color: var(--tinta-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ns:hover { -webkit-line-clamp: unset; }
  .meta-etapa .barra { margin-top: 6px; height: 5px; }
  .meta-etapa .barra > span.pasado { background: var(--critico); }
  .derecha { text-align: right; }
  .quien { display: grid; gap: 4px; justify-items: start; }
  @media (max-width: 760px) {
    .fila { grid-template-columns: 24px 1fr; }
    .fila > :nth-child(n+3) { grid-column: 2; }
    .fila.cabecera { display: none; }
    .derecha { text-align: left; }
  }

  .mustwin { display: grid; gap: 10px; }
  .mw { border: 1px solid var(--borde); border-radius: 8px; padding: 12px; display: grid; gap: 6px; }
  .mw .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .mw .monto { font-weight: 650; }

  .personas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .persona { border: 1px solid var(--borde); border-radius: 8px; padding: 12px; display: grid; gap: 10px; align-content: start; }
  .persona .cab { display: flex; align-items: center; gap: 10px; }
  .persona img, .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--superficie-2); flex: none; display: grid; place-items: center; font-weight: 650; }
  .persona h3 { font-size: 14px; }
  .persona h4 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--tinta-3); font-weight: 600; }
  .persona ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 6px; }
  .persona li { display: grid; gap: 2px; font-size: 13px; }
  .persona li .linea { display: flex; gap: 6px; align-items: baseline; justify-content: space-between; }
  .persona li .txt { color: var(--tinta-2); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

  .funnel { display: grid; gap: 8px; }
  .fn { display: grid; grid-template-columns: 120px 1fr 150px; gap: 10px; align-items: center; font-size: 13px; }
  .fn .barra { height: 18px; border-radius: 4px; }
  .fn .barra > span { border-radius: 0 4px 4px 0; }
  .fn .num { text-align: right; }

  .lista { list-style: none; margin: 0; padding: 0; }
  .lista li { display: flex; gap: 10px; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--borde); font-size: 13px; }
  .lista li:first-child { border-top: 0; }

  .filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filtros button { font-size: 12px; padding: 3px 10px; border-radius: 999px; }
  .tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tabla th { text-align: left; font-size: 11px; color: var(--tinta-3); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; padding: 0 8px 6px 0; }
  .tabla td { border-top: 1px solid var(--borde); padding: 8px 8px 8px 0; vertical-align: top; }
  .scroll { overflow-x: auto; }
  .nota { font-size: 12px; color: var(--tinta-3); }
  #error { display: none; background: var(--superficie); border: 1px solid var(--critico); border-radius: var(--radio); padding: 12px 16px; }
  .cargando { padding: 80px 24px; text-align: center; color: var(--tinta-2); }
  @media (max-width: 600px) { header, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <h1>Torre de control · Pipeline Chile</h1>
  <span class="muted" id="actualizado">Leyendo Attio…</span>
  <div class="acciones">
    <span class="tenue">Ver:</span>
    <span id="filtro-personas"></span>
    <button id="refrescar">Actualizar</button>
    <a class="boton" href="/tv">Modo TV</a>
  </div>
</header>
<main id="app"><div class="cargando">Leyendo Attio… la primera carga toma unos 15 segundos.</div></main>
<div id="error"></div>

<script type="module">
import { cargarDatos, usd, fecha, hora, esc, etapaCorta, estadoNextStep } from '/common.js';

let datos = null;
let persona = 'Todos';
let problema = 'Todos';
try { persona = localStorage.getItem('torre-persona') ?? 'Todos'; } catch {}

const $ = (s) => document.querySelector(s);
const deEllos = (d) => persona === 'Todos' || d.responsable === persona;

function chipsDeal(d) {
  const t = [];
  if (d.mustWin) t.push('<span class="chip sin-punto">★ Must-win</span>');
  if (d.tgp) t.push('<span class="chip sin-punto">TGP</span>');
  if (d.estancado) t.push(`<span class="chip serio">Estancado</span>`);
  return t.length ? `<div class="tags">${t.join('')}</div>` : '';
}

function barraEtapa(d) {
  if (!d.limiteEtapa) return '';
  const pct = Math.min(100, (d.diasEtapa / d.limiteEtapa) * 100);
  return `<div class="barra" title="${d.diasEtapa} de ${d.limiteEtapa} días permitidos"><span class="${d.diasEtapa > d.limiteEtapa ? 'pasado' : ''}" style="width:${pct}%"></span></div>`;
}

function filaCola(d, i) {
  const e = estadoNextStep(d);
  const pelota = d.pelota ? `<span class="chip ${d.pelota === 'Cliente' ? '' : 'sin-punto'}" title="${d.pelotaPorTexto ? 'Inferido del texto del next step' : 'Campo de Attio'}">Pelota: ${esc(d.pelota)}${d.pelotaPorTexto ? '*' : ''}</span>` : '';
  return `<div class="fila">
    <div class="rank">${i + 1}</div>
    <div class="cuenta"><a href="${d.url}" target="_blank" rel="noopener">${esc(d.cuenta)}</a>${chipsDeal(d)}</div>
    <div class="meta-etapa"><div>${esc(etapaCorta(d.etapa))}</div><div class="tenue">${d.diasEtapa} d${d.limiteEtapa ? ' / ' + d.limiteEtapa : ''}</div>${barraEtapa(d)}</div>
    <div class="derecha"><strong>${d.arrEstimado ? '≈' : ''}${usd(d.arrUsd)}</strong><div class="tenue">firma ${d.firmaEsperada ? fecha(d.firmaEsperada) : '—'}</div></div>
    <div><div class="ns" title="${esc(d.nextStep)}">${esc(d.nextStep) || '<span class="tenue">Sin next step</span>'}</div></div>
    <div class="quien"><span class="chip ${e.clase}">${e.texto}${d.fechaNextStepLeidaDelTexto ? '*' : ''}</span>${pelota}<span class="muted">${esc(d.responsable ?? 'Sin responsable')}</span></div>
  </div>`;
}

function render() {
  const d = datos;
  const m = d.meta;
  $('#actualizado').textContent = `Attio · ${hora(d.actualizado)} · se actualiza cada 5 min`;

  const personas = ['Todos', ...d.personas.map((p) => p.corto)];
  $('#filtro-personas').innerHTML = personas
    .map((p) => `<button data-persona="${p}" aria-pressed="${p === persona}">${p}</button>`)
    .join(' ');

  const cola = d.cola.filter(deEllos).slice(0, 12);
  const higiene = d.higiene.filter(deEllos);
  const tipos = {};
  for (const x of higiene) for (const p of x.problemas) {
    const k = p.replace(/\d+ días en .*/, 'Estancado en la etapa').replace(/hace \d+ días/, 'hace +7 días');
    tipos[k] = (tipos[k] ?? 0) + 1;
  }
  const higieneVista = problema === 'Todos' ? higiene : higiene.filter((x) => x.problemas.some((p) => p.replace(/\d+ días en .*/, 'Estancado en la etapa').replace(/hace \d+ días/, 'hace +7 días') === problema));
  const maxFunnel = Math.max(...d.funnel.map((f) => f.arrUsd), 1);

  $('#app').innerHTML = `
  <section class="kpis">
    <div class="kpi"><span class="etq">ARR firmado 2026</span><span class="num">${usd(m.arrFirmadoUsd)}</span>
      <div class="barra" title="${Math.round(m.avance * 100)}% de la meta"><span style="width:${Math.min(100, m.avance * 100)}%"></span></div>
      <span class="sub">${Math.round(m.avance * 100)}% de ${usd(m.metaUsd)} · en vivo ${usd(m.arrEnVivoUsd)}</span></div>
    <div class="kpi"><span class="etq">Falta para la meta</span><span class="num">${usd(m.faltaUsd)}</span><span class="sub">${m.diasAlCierre} días al 31-dic · ${usd(m.ritmoSemanalUsd)} por semana</span></div>
    <div class="kpi"><span class="etq">Ponderado que firma en 2026</span><span class="num">${usd(m.ponderado2026Usd)}</span><span class="sub">ARR × probabilidad de la etapa</span></div>
    <div class="kpi"><span class="etq">Pipeline abierto</span><span class="num">${usd(m.pipelineAbiertoUsd)}</span><span class="sub">${m.dealsAbiertos} deals abiertos</span></div>
    <div class="kpi"><span class="etq">Next steps vencidos</span><span class="num" style="color:var(--critico-texto)">${d.cola.filter((x) => x.vencido && deEllos(x)).length}</span><span class="sub">${d.cola.filter((x) => !x.nextStep && deEllos(x)).length} deals sin next step</span></div>
  </section>

  <section class="dos">
    <div class="panel">
      <h2>Dónde presionar hoy</h2>
      <p class="pregunta">Ordenado por ARR × probabilidad de la etapa × urgencia (vencido, estancado, must-win, firma en 2026, días sin actividad).</p>
      <div class="fila cabecera"><div>#</div><div>Deal</div><div>Etapa · días</div><div class="derecha">ARR</div><div>Next step</div><div>Estado</div></div>
      ${cola.map(filaCola).join('') || '<p class="muted">Nada pendiente.</p>'}
    </div>
    <div class="panel">
      <h2>Camino al millón</h2>
      <p class="pregunta">Must-win de Tomi (9-oct) y lo ya firmado.</p>
      <div class="mustwin">
        ${m.firmados.map((f) => `<div class="mw"><div class="top"><strong>${esc(f.cuenta)}</strong><span class="monto">${usd(f.arrUsd)}</span></div><span class="chip bien">${esc(etapaCorta(f.etapa))}</span></div>`).join('')}
        ${d.mustWin.filter((x) => x.abierto).map((x) => {
          const e = estadoNextStep(x);
          return `<div class="mw"><div class="top"><a href="${x.url}" target="_blank" rel="noopener"><strong>${esc(x.cuenta)}</strong></a><span class="monto">${x.arrEstimado ? '≈' : ''}${usd(x.arrUsd)}</span></div>
          <div class="tags"><span class="chip sin-punto">${esc(etapaCorta(x.etapa))} · ${x.diasEtapa} d</span><span class="chip ${e.clase}">${e.texto}</span>${x.estancado ? '<span class="chip serio">Estancado</span>' : ''}</div>
          <div class="nota">${esc((x.nextStep ?? 'Sin next step').slice(0, 140))}${(x.nextStep ?? '').length > 140 ? '…' : ''}</div>
          <div class="muted" style="font-size:12px">${esc(x.responsable ?? 'Sin responsable')}</div></div>`;
        }).join('')}
        <p class="nota">Falta elegir el cuarto must-win entre Policenter, Sanasalud, Andes, FALP, Cetep e Inmunomédica.</p>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Lo que tiene cada uno</h2>
    <p class="pregunta">"Nos toca" se hace el mismo día. "Esperando al cliente" se persigue a los ${d.pelotaClienteDias} días hábiles.</p>
    <div class="personas">
      ${d.personas.filter((p) => persona === 'Todos' || p.corto === persona).map((p) => `
        <div class="persona">
          <div class="cab">${p.avatar ? `<img src="${esc(p.avatar)}" alt="">` : `<span class="avatar">${esc(p.corto[0])}</span>`}
            <div><h3>${esc(p.corto)}</h3><span class="${p.vencidos ? '' : 'muted'}" style="font-size:12px;${p.vencidos ? 'color:var(--critico-texto);font-weight:600' : ''}">${p.vencidos} vencidos</span></div></div>
          <div><h4>Nos toca (${p.nosToca.length})</h4><ul>${p.nosToca.slice(0, 6).map((x) => {
            const e = estadoNextStep(x);
            return `<li><div class="linea"><a href="${x.url}" target="_blank" rel="noopener">${esc(x.cuenta)}</a><span class="chip ${e.clase}">${e.texto}</span></div><span class="txt">${esc(x.nextStep)}</span></li>`;
          }).join('') || '<li class="tenue">Nada</li>'}${p.nosToca.length > 6 ? `<li class="tenue">y ${p.nosToca.length - 6} más</li>` : ''}</ul></div>
          <div><h4>Esperando al cliente (${p.esperandoCliente.length})</h4><ul>${p.esperandoCliente.slice(0, 4).map((x) => `<li><div class="linea"><a href="${x.url}" target="_blank" rel="noopener">${esc(x.cuenta)}</a><span class="chip ${x.diasInactivo > d.pelotaClienteDias ? 'aviso' : ''}">${x.diasInactivo} d sin noticias</span></div></li>`).join('') || '<li class="tenue">Nada</li>'}</ul></div>
          <div><h4>Tareas en Attio (${p.tareas.length})</h4><ul>${p.tareas.slice(0, 5).map((t) => `<li><div class="linea"><span>${esc(t.texto)}</span><span class="chip ${t.vencida ? 'critico' : ''}">${t.vence ? fecha(t.vence) : 'Sin fecha'}</span></div></li>`).join('') || '<li class="tenue">Nada</li>'}</ul></div>
        </div>`).join('')}
    </div>
  </section>

  <section class="mitades">
    <div class="panel">
      <h2>Funnel por etapa</h2>
      <p class="pregunta">ARR total en cada etapa (barra) y cantidad de deals. Entre paréntesis, los estancados.</p>
      <div class="funnel">${d.funnel.map((f) => `<div class="fn" title="${esc(f.etapa)}: ${f.deals} deals · ${usd(f.arrUsd, { exacto: true })} · ponderado ${usd(f.ponderadoUsd)}">
        <span>${esc(etapaCorta(f.etapa))}</span>
        <div class="barra"><span style="width:${(f.arrUsd / maxFunnel) * 100}%"></span></div>
        <span class="num"><strong>${usd(f.arrUsd)}</strong> · ${f.deals}${f.estancados ? ` <span style="color:var(--critico-texto)">(${f.estancados})</span>` : ''}</span></div>`).join('')}</div>
    </div>
    <div class="panel">
      <h2>Movimiento de los últimos 7 días</h2>
      <p class="pregunta">Cambios de etapa registrados en Attio.</p>
      <ul class="lista">${d.movimientosSemana.map((x) => `<li><span><a href="${x.url}" target="_blank" rel="noopener">${esc(x.cuenta)}</a>: ${esc(etapaCorta(x.de))} → <strong>${esc(etapaCorta(x.a))}</strong></span><span class="tenue">${fecha(x.fecha)}${x.por ? ' · ' + esc(x.por) : ''}</span></li>`).join('') || '<li class="tenue">Sin cambios esta semana.</li>'}</ul>
    </div>
  </section>

  <section class="panel">
    <h2>Candidatos a Closed lost</h2>
    <p class="pregunta">Más del doble de días permitidos en su etapa y sin actividad hace más de 7 días. Se deciden en la revisión del lunes: perdido o se revive con un next step.</p>
    <div class="scroll"><table class="tabla"><thead><tr><th>Deal</th><th>Etapa</th><th>Días en la etapa</th><th>Sin actividad</th><th>ARR</th><th>Responsable</th></tr></thead><tbody>
    ${d.candidatosPerdido.filter(deEllos).map((x) => `<tr><td><a href="${x.url}" target="_blank" rel="noopener">${esc(x.cuenta)}</a></td><td>${esc(etapaCorta(x.etapa))}</td><td>${x.diasEtapa}</td><td>${x.diasInactivo} d</td><td>${usd(x.arrUsd)}</td><td>${esc(x.responsable ?? '—')}</td></tr>`).join('') || '<tr><td colspan="6" class="tenue">Ninguno.</td></tr>'}
    </tbody></table></div>
  </section>

  <section class="panel">
    <h2>Higiene del pipeline</h2>
    <p class="pregunta">Lo que hay que arreglar en Attio para que las alertas funcionen. ${higiene.length} deals con algo pendiente.</p>
    <div class="filtros">${['Todos', ...Object.keys(tipos).sort((a, b) => tipos[b] - tipos[a])].map((t) => `<button data-problema="${esc(t)}" aria-pressed="${t === problema}">${esc(t)}${t === 'Todos' ? '' : ' · ' + tipos[t]}</button>`).join('')}</div>
    <div class="scroll"><table class="tabla"><thead><tr><th>Deal</th><th>Etapa</th><th>ARR</th><th>Responsable</th><th>Qué falta</th></tr></thead><tbody>
    ${higieneVista.map((x) => `<tr><td><a href="${x.url}" target="_blank" rel="noopener">${esc(x.cuenta)}</a></td><td>${esc(etapaCorta(x.etapa))}</td><td>${x.arrEstimado ? '≈' : ''}${usd(x.arrUsd)}</td><td>${esc(x.responsable ?? '—')}</td><td>${x.problemas.map(esc).join(' · ')}</td></tr>`).join('')}
    </tbody></table></div>
  </section>

  <p class="nota">* Respaldo mientras no existan los 4 campos nuevos en Attio: la fecha del next step se lee del texto, la pelota se infiere del texto ("esperar respuesta…" = cliente), y los must-win se marcan por nombre. ≈ = ARR en USD estimado desde CLP a 930 porque Attio tiene el USD en 0.</p>`;
}

async function cargar(refrescar) {
  try {
    $('#refrescar').disabled = true;
    datos = await cargarDatos({ refrescar });
    $('#error').style.display = 'none';
    render();
  } catch (e) {
    $('#error').style.display = 'block';
    $('#error').textContent = 'No se pudo leer Attio: ' + e.message;
  } finally {
    $('#refrescar').disabled = false;
  }
}

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.id === 'refrescar') return cargar(true);
  if (b.dataset.persona) {
    persona = b.dataset.persona;
    try { localStorage.setItem('torre-persona', persona); } catch {}
    render();
  }
  if (b.dataset.problema) { problema = b.dataset.problema; render(); }
});

cargar(false);
setInterval(() => cargar(false), 5 * 60 * 1000);
</script>
</body>
</html>
