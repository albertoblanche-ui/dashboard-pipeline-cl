<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torre de control</title>
<link rel="stylesheet" href="/styles.css">
<style>
  header {
    position: sticky; top: 0; z-index: 5; background: var(--plano); border-bottom: 1px solid var(--borde);
    padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  main { padding: 24px; max-width: 1600px; margin: 0 auto; display: grid; gap: 24px; }
  .panel { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 20px; }
  .panel h2 { font-size: 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .kpi { background: var(--superficie); padding: 16px; border-radius: var(--radio); border: 1px solid var(--borde); }
  .kpi .etq { font-size: 12px; color: var(--tinta-2); text-transform: uppercase; font-weight: 600; }
  .kpi .num { font-size: 28px; font-weight: 700; margin: 4px 0; color: var(--azul); }
  .kpi .sub { font-size: 12px; color: var(--tinta-3); }

  /* Gráficos de Tracción */
  .graficos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 20px; }
  .chart-wow { display: flex; align-items: flex-end; gap: 12px; height: 140px; padding-top: 24px; border-bottom: 1px solid var(--borde); }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 6px; }
  .bar-fill { width: 100%; max-width: 38px; background: var(--azul); border-radius: 4px 4px 0 0; min-height: 4px; transition: height 0.3s; }
  .bar-lbl { font-size: 11px; color: var(--tinta-3); }
  .bar-val { font-size: 11px; font-weight: 700; color: var(--tinta); }

  .progreso-meta { display: flex; height: 26px; border-radius: 8px; overflow: hidden; background: var(--superficie-2); margin: 16px 0 10px; }
  .prog-firmado { background: var(--bien); }
  .prog-avanzado { background: var(--azul); }
  .prog-temprano { background: var(--aviso); }
  .leyenda-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; }
  .item-leyenda { display: flex; align-items: center; gap: 6px; }
  .punto-leyenda { width: 10px; height: 10px; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <h1>Torre de control</h1>
    <span class="muted" style="font-size:12px" id="actualizado">Leyendo Attio...</span>
  </div>
  <div class="header-right">
    <select id="filtro-owner">
      <option value="Todos">Todos los owners</option>
    </select>
    <button id="refrescar">Actualizar</button>
    <a class="boton" style="background:var(--superficie-2); color:var(--tinta); border:1px solid var(--borde);" href="/iniciativas">Mis iniciativas</a>
    <a class="boton" href="/tv">Modo TV</a>
  </div>
</header>
<main id="app">
  <div style="padding: 40px; text-align: center; color: var(--tinta-3);">Cargando el pipeline...</div>
</main>

<dialog id="modal-deal">
  <div class="modal-content" id="modal-body"></div>
</dialog>

<script type="module">
import { cargarDatos, usd, fecha, hora, esc, etapaCorta, estadoNextStep } from '/common.js';

let datos = null;
let ownerActual = 'Todos';
try { ownerActual = localStorage.getItem('torre-owner') ?? 'Todos'; } catch {}

const $ = (s) => document.querySelector(s);
const deEllos = (d) => ownerActual === 'Todos' || d.owner === ownerActual || d.responsable === ownerActual;

const modal = $('#modal-deal');
window.abrirDeal = function(id) {
  const d = datos.deals.find(x => x.id === id);
  if (!d) return;
  
  let sugerencia = "Revisar contexto reciente en correos/slack para definir próximo paso.";
  if (d.problemas.includes('Sin responsable')) sugerencia = "Asignar un owner claro a este deal en Attio.";
  else if (d.vencido) sugerencia = `Contactar a ${d.responsable ?? 'encargado'} para fijar una nueva fecha límite realista y no dejar enfriar el deal.`;
  else if (d.pelota === 'Cliente' && d.diasInactivo > 3) sugerencia = "Enviar un mensaje de 'ping' sutil o aportar material de valor al sponsor para retomar tracción.";
  else if (d.estancado) sugerencia = `Deal estancado en ${etapaCorta(d.etapa)}. Escalar internamente o agendar llamada de alineación técnica/comercial urgente.`;
  else if (d.candidatoPerdido) sugerencia = "Evaluar mover a Closed Lost para limpiar el pipeline, o hacer un último intento agresivo (ej. invitación de Tomi).";

  $('#modal-body').innerHTML = `
    <div class="modal-header">
      <div>
        <h2 style="font-size:20px; color:var(--azul)">${esc(d.cuenta)}</h2>
        <span class="chip sin-punto">${esc(etapaCorta(d.etapa))}</span>
      </div>
      <button class="modal-close" onclick="document.getElementById('modal-deal').close()">&times;</button>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; font-size:13px;">
      <div><strong>ARR:</strong> ${d.arrEstimado ? '≈ ' : ''}${usd(d.arrUsd)}</div>
      <div><strong>Firma esperada:</strong> ${d.firmaEsperada ? fecha(d.firmaEsperada) : 'No definida'}</div>
      <div><strong>Días en etapa:</strong> ${d.diasEtapa} días ${d.estancado ? ' (Estancado)' : ''}</div>
      <div><strong>Owner:</strong> ${esc(d.owner ?? 'Sin dueño')}</div>
    </div>
    <div class="sugerencia-box">
      <strong>Sugerencia de Próximo Paso (Heurística)</strong>
      ${sugerencia}
    </div>
    <div>
      <strong style="color:var(--tinta-2); font-size:12px;">NEXT STEP ACTUAL EN ATTIO</strong>
      <p style="background:var(--superficie-2); padding:10px; border-radius:6px; margin-top:4px; font-size:13px; line-height:1.5;">${esc(d.nextStep || 'Sin next step registrado.')}</p>
    </div>
    <div style="text-align:right; margin-top:8px;">
      <a href="${d.url}" target="_blank" class="boton">Abrir en Attio &rarr;</a>
    </div>
  `;
  modal.showModal();
};
modal.addEventListener('click', (e) => { if(e.target === modal) modal.close(); });

function barraEtapa(d) {
  if (!d.limiteEtapa) return '';
  const pct = Math.min(100, (d.diasEtapa / d.limiteEtapa) * 100);
  return `<div style="height:4px; background:var(--superficie-2); border-radius:4px; margin-top:4px; overflow:hidden;"><div style="height:100%; background:${d.diasEtapa > d.limiteEtapa ? 'var(--critico)' : 'var(--azul)'}; width:${pct}%"></div></div>`;
}

function render() {
  const d = datos;
  const m = d.meta;
  $('#actualizado').textContent = `Attio · ${hora(d.actualizado)}`;

  const ownersUnicos = [...new Set(d.deals.map(x => x.owner).filter(Boolean))];
  const select = $('#filtro-owner');
  if(select.options.length === 1) {
    ownersUnicos.forEach(o => select.innerHTML += `<option value="${o}" ${o===ownerActual?'selected':''}>${o}</option>`);
  }

  const abiertos = d.cola.filter(deEllos);
  const higiene = d.higiene.filter(deEllos);
  const etapasKanban = d.funnel.filter(f => f.etapa !== 'Closed lost' && f.etapa !== 'Churned');

  // Datos para gráfico WoW
  const maxWoW = Math.max(...d.demandGenWoW.map(x => x.deals), 1);
  
  // Datos para Pipeline by ARR vs Meta
  const des = d.desgloseArr;
  const pctFirmado = Math.min(100, (des.firmadoUsd / des.metaUsd) * 100);
  const pctAvanzado = Math.min(100 - pctFirmado, (des.avanzadoUsd / des.metaUsd) * 100);
  const pctTemprano = Math.min(100 - pctFirmado - pctAvanzado, (des.tempranoUsd / des.metaUsd) * 100);

  $('#app').innerHTML = `
  <section class="kpis">
    <div class="kpi">
      <span class="etq">ARR Firmado 2026</span>
      <div class="num">${usd(m.arrFirmadoUsd)}</div>
      <div class="sub">${Math.round(m.avance * 100)}% de la meta de ${usd(m.metaUsd)}</div>
    </div>
    <div class="kpi">
      <span class="etq">Falta para la meta</span>
      <div class="num">${usd(m.faltaUsd)}</div>
      <div class="sub">${m.diasAlCierre} días · Ritmo: ${usd(m.ritmoSemanalUsd)}/sem</div>
    </div>
    <div class="kpi">
      <span class="etq">Pipeline Abierto</span>
      <div class="num">${usd(m.pipelineAbiertoUsd)}</div>
      <div class="sub">${abiertos.length} deals en juego filtrados</div>
    </div>
  </section>

  <!-- Gráficos de Tracción -->
  <section class="graficos-grid">
    <div class="panel">
      <h2>CL - Demand Generation WoW</h2>
      <p class="muted" style="font-size:12px; margin:0;">Nuevas oportunidades creadas por semana en Chile.</p>
      <div class="chart-wow">
        ${d.demandGenWoW.map(s => {
          const h = (s.deals / maxWoW) * 90;
          return `
          <div class="bar-col" title="${s.deals} deals (${usd(s.arrUsd)})">
            <span class="bar-val">${s.deals}</span>
            <div class="bar-fill" style="height:${Math.max(6, h)}%;"></div>
            <span class="bar-lbl">${s.etiqueta}</span>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="panel">
      <h2>Pipeline vs. Meta USD 1M</h2>
      <p class="muted" style="font-size:12px; margin:0;">Volumen actual acumulado frente al objetivo anual.</p>
      <div class="progreso-meta">
        <div class="prog-firmado" style="width:${pctFirmado}%;" title="Firmado: ${usd(des.firmadoUsd)}"></div>
        <div class="prog-avanzado" style="width:${pctAvanzado}%;" title="Avanzado (PoC / Neg.): ${usd(des.avanzadoUsd)}"></div>
        <div class="prog-temprano" style="width:${pctTemprano}%;" title="Temprano: ${usd(des.tempranoUsd)}"></div>
      </div>
      <div class="leyenda-meta">
        <div class="item-leyenda"><span class="punto-leyenda prog-firmado"></span>Firmado: <strong>${usd(des.firmadoUsd)}</strong></div>
        <div class="item-leyenda"><span class="punto-leyenda prog-avanzado"></span>Avanzado: <strong>${usd(des.avanzadoUsd)}</strong></div>
        <div class="item-leyenda"><span class="punto-leyenda prog-temprano"></span>Temprano: <strong>${usd(des.tempranoUsd)}</strong></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>La Carrera hacia el Millón (Pipeline Macro)</h2>
    <p class="muted" style="font-size:13px; margin-bottom:12px;">Haz clic en cualquier tarjeta para ver detalles y sugerencias. Bordes verdes indican avance esta semana.</p>
    <div class="kanban-scroll">
      <div class="kanban-board">
        ${etapasKanban.map(col => {
          const dealsEtapa = abiertos.filter(x => x.etapa === col.etapa);
          const totalUsd = dealsEtapa.reduce((sum, val) => sum + val.arrUsd, 0);
          return `
          <div class="kanban-col">
            <div class="kanban-cabecera">
              <h3>${esc(etapaCorta(col.etapa))} <span class="muted">(${dealsEtapa.length})</span></h3>
              <span class="total">${usd(totalUsd)}</span>
            </div>
            ${dealsEtapa.map(deal => {
              const e = estadoNextStep(deal);
              const movido = deal.movimientos.length > 0 ? 'movido' : '';
              return `
              <div class="k-card ${movido}" onclick="abrirDeal('${deal.id}')">
                <div class="k-top">
                  <div class="k-nombre">${esc(deal.cuenta)} ${deal.mustWin ? '★' : ''}</div>
                  <div title="Owner">${deal.owner ? `<div class="avatar">${esc(deal.owner[0])}</div>` : ''}</div>
                </div>
                <div class="k-arr">${deal.arrEstimado ? '≈' : ''}${usd(deal.arrUsd)}</div>
                <div class="k-bot">
                  <span class="chip ${e.clase}">${e.texto}</span>
                  <span class="muted" style="font-size:11px">${deal.diasEtapa}d</span>
                </div>
                ${barraEtapa(deal)}
              </div>`
            }).join('') || '<div class="muted" style="font-size:12px; text-align:center; padding:10px 0;">Vacío</div>'}
          </div>`;
        }).join('')}
      </div>
    </div>
  </section>

  <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap:24px;">
    <section class="panel">
      <h2>Dónde presionar hoy (Cola ordenada)</h2>
      <p class="muted" style="font-size:12px; margin-bottom:12px;">Ordenado por etapa más avanzada y mayor ticket.</p>
      <div style="overflow-x:auto;">
        <table class="tabla">
          <thead><tr><th>Deal</th><th>Etapa</th><th>ARR</th><th>Estado / Próximo Paso</th></tr></thead>
          <tbody>
            ${abiertos.slice(0,15).map(d => {
              const e = estadoNextStep(d);
              return `<tr onclick="abrirDeal('${d.id}')">
                <td><strong>${esc(d.cuenta)}</strong></td>
                <td>${esc(etapaCorta(d.etapa))}</td>
                <td>${usd(d.arrUsd)}</td>
                <td><span class="chip ${e.clase}">${e.texto}</span> <span class="muted" style="font-size:12px">${d.pelota==='Cliente'?'(Esperando Cliente)':''}</span></td>
              </tr>`;
            }).join('') || '<tr><td colspan="4" class="muted">Nada pendiente.</td></tr>'}
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Higiene y Cuellos de botella</h2>
      <p class="muted" style="font-size:12px; margin-bottom:12px;">Deals que requieren arreglos en Attio o están trabados.</p>
      <div style="overflow-x:auto;">
        <table class="tabla">
          <thead><tr><th>Deal</th><th>Responsable</th><th>Qué falta (Alertas)</th></tr></thead>
          <tbody>
            ${higiene.slice(0,10).map(d => `
              <tr onclick="abrirDeal('${d.id}')">
                <td><strong>${esc(d.cuenta)}</strong></td>
                <td>${esc(d.responsable ?? '—')}</td>
                <td style="color:var(--critico-texto); font-size:12px;">${d.problemas.map(esc).join(' • ')}</td>
              </tr>
            `).join('') || '<tr><td colspan="3" class="muted">Pipeline impecable.</td></tr>'}
          </tbody>
        </table>
      </div>
    </section>
  </div>
  `;
}

async function cargar() {
  try {
    $('#refrescar').disabled = true;
    datos = await cargarDatos();
    render();
  } catch (e) {
    $('#app').innerHTML = `<div style="padding:40px; color:var(--critico); text-align:center;">Error: ${e.message}</div>`;
  } finally {
    $('#refrescar').disabled = false;
  }
}

document.addEventListener('click', (ev) => {
  if (ev.target.id === 'refrescar') cargar();
});
$('#filtro-owner').addEventListener('change', (e) => {
  ownerActual = e.target.value;
  try { localStorage.setItem('torre-owner', ownerActual); } catch {}
  render();
});

cargar();
setInterval(cargar, 5 * 60 * 1000);
</script>
</body>
</html>
